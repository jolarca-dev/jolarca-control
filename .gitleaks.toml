# .gitleaks.toml — gitleaks configuration for jolarca-control.
#
# jolarca-control — marketplace governance control plane.
# SOC 2 CC6.1 / ISO 27001 A.8.24 / GDPR Art.32.
#
# There is no path or regex allowlist here. The fix for ADR-0009 F-01 is
# runtime assembly of synthetic fixtures in the source (`"AKIA" + "<body>"`,
# `"sk_live_" + "<body>"`), which means no literal secret shape exists in
# either the working tree or any blob `gitleaks git` scans. Empirically
# verified 2026-10-07: `gitleaks dir .` and `gitleaks git .` against a
# title-only config both report `no leaks found` (exit 0), across 86 commits.
#
# Prior revisions excluded `tests/test_repo_readiness_audit.py` and
# `tests/test_first_commit_pipeline.py` from scanning. That exclusion is
# removed here. Rationale: excluding tests/ from a secret sweep is the same
# class of weakening AGENTS.md §5 forbids -- "a real secret pasted into a test
# file is still a real secret", and an always-green gate trains dismissal.
# The path allowlist was originally added under ADR-0009 F-04 as belt-and-
# braces while the runtime-assembly refactor was landing; empirical
# re-verification shows it is not load-bearing.
#
# L-16 (the readiness gate's own git-history regex sweep, distinct from
# gitleaks) is separately documented as an accepted false positive for
# historical blobs at 0e17920 / c4b6c5a; see
# docs/security/f01-l16-synthetic-fixture-acceptance.md.

