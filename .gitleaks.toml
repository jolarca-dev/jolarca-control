# .gitleaks.toml — gitleaks configuration for jolarca-control.
#
# jolarca-control — marketplace (jolarca-dev) governance control plane.
# SOC 2 CC6.1 / ISO 27001 A.8.24 / GDPR Art.32.
#
# This file configures gitleaks to handle synthetic test fixtures that match
# secret patterns but are NOT real credentials. The negative-control test in
# tests/test_first_commit_pipeline.py fails the build if the ruleset is ever
# emptied.
#
# IMPORTANT: regex-based allowlisting of specific secret VALUES is deliberately
# avoided here because GitHub push protection would flag the allowlist itself
# as a secret. Path-based exclusion is used instead: the test files are the
# ONLY locations where synthetic fixtures exist, and they are excluded from
# gitleaks scanning entirely. The runtime-assembly fix in the source (string
# concatenation) is the primary defense; this file is defense in depth.
#
# L-16 false-positive acceptance recorded under RB-04.

title = "jolarca-control gitleaks config"

# ── Path-based exclusions for synthetic test fixtures ─────────────────────────
# These files contain synthetic fixtures by design. No real credentials should
# ever appear in test files; if they do, the filesystem sweep (L-15) catches
# them independently of gitleaks.
[allowlist]
  description = "Synthetic test fixtures — paths excluded from scanning"
  paths = [
    # Test files contain synthetic fixtures assembled at runtime.
    # The source uses string concatenation so no literal secret shape exists
    # in the working tree, but historical commits may contain literals.
    '''tests/test_repo_readiness_audit\.py''',
    # First-commit pipeline tests also assemble fixtures at runtime.
    '''tests/test_first_commit_pipeline\.py''',
    # gitleaks configuration itself (this file)
    '''\.gitleaks\.toml''',
  ]
