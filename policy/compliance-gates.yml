# ──────────────────────────────────────────────────────────────────────────────
# Compliance Gates — enforced security & compliance checks for ALL
# jolarca-dev marketplace repositories
# ──────────────────────────────────────────────────────────────────────────────
# Owner:      jolarca-dev organization owner
# Compliance: SOC 2 Type II · GDPR · ISO 27001:2022 · PCI-DSS 4.0
#
# Unlike jol-control, pci-dss applies to EVERY repo here: the whole
# marketplace tree sits in or adjacent to the cardholder-data environment.
# ──────────────────────────────────────────────────────────────────────────────

metadata:
  version: "1.1.0"
  last_reviewed: "2026-09-28"
  next_review: "2026-12-25"
  owner: "jolarca-dev organization owner"
  approved_by: "Gintaras Kazlauskas"

gates:
  fleet_separation:
    id: "fleet-separation-guard"
    description: "Prove the org's jolarca* repo set matches the allow-list exactly (ADR-0004)"
    enforcement: "mandatory"
    frameworks: ["soc2", "gdpr", "iso27001", "pci-dss"]
    soc2_controls: ["CC6.6"]
    iso_controls: ["A.5.3", "A.5.9"]
    pci_controls: ["1.2.1"]
    implementation:
      tool: "scripts/check_fleet_separation.sh"
      workflow: ".github/workflows/fleet-separation-guard.yml"
      run_on: ["push", "pull_request", "schedule(weekly)"]
      detects:
        - "out-of-band jolarca* repo creation (incident — 48h import rule)"
        - "allow-list repo missing from the org (drift or deletion)"
        - "mission-platform jol-* entry leaking into this allow-list"
    remediation:
      - "Out-of-band repo: add a repos/<name>.yml entry and import into state within 48h"
      - "Missing repo: treat as a possible deletion — open an incident immediately"
      - "jol-* entry: remove it; mission repos belong to jol-control"

  dependency_scan:
    id: "dependency-review"
    description: "Block PRs that introduce known-vulnerable dependencies"
    enforcement: "mandatory"
    frameworks: ["soc2", "gdpr", "iso27001", "pci-dss"]
    soc2_controls: ["CC7.1", "CC7.2"]
    iso_controls: ["A.8.8", "A.8.19"]
    pci_controls: ["6.3.1", "6.3.3"]
    implementation:
      tool: "GitHub Dependency Review Action"
      action: "actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294"  # v5, SHA-pinned
      fail_on_severity: "moderate"
      deny_licenses: ["GPL-3.0", "AGPL-3.0", "SSPL-1.0"]
      run_on: ["pull_request"]
    remediation:
      - "Update the vulnerable dependency to a patched version"
      - "If no patch is available, document risk acceptance in jolarca-compliance"

  secret_scan:
    id: "secret-scanning"
    description: "Prevent secrets, tokens and credentials from entering git history"
    enforcement: "mandatory"
    frameworks: ["soc2", "gdpr", "iso27001", "pci-dss"]
    soc2_controls: ["CC6.1", "CC6.6"]
    iso_controls: ["A.5.10", "A.8.24"]
    pci_controls: ["3.5.1", "8.3.2"]
    implementation:
      tool: "GitHub Secret Scanning + Push Protection, plus gitleaks in CI"
      native: true
      custom_patterns:
        - pattern: "jolarca_(live|test)_[a-zA-Z0-9]{32,}"
          description: "Jolarca marketplace API keys"
      run_on: ["push", "pull_request"]
    remediation:
      - "Immediately rotate the exposed secret (docs/runbooks/github-token-rotation.md)"
      - "Remove from git history with git-filter-repo or BFG"
      - "Record the incident in jolarca-compliance"

  license_check:
    id: "license-check"
    description: "Ensure all INBOUND DEPENDENCIES use approved licenses"
    enforcement: "mandatory"
    frameworks: ["soc2", "iso27001", "pci-dss"]
    soc2_controls: ["CC6.1"]
    iso_controls: ["A.5.10"]
    pci_controls: ["6.3.2"]
    implementation:
      tool: "license-checker"
      allowed_licenses:
        - "MIT"
        - "Apache-2.0"
        - "BSD-2-Clause"
        - "BSD-3-Clause"
        - "ISC"
        - "Unlicense"
        - "CC0-1.0"
        - "0BSD"
      denied_licenses:
        - "GPL-2.0"
        - "GPL-3.0"
        - "AGPL-3.0"
        - "SSPL-1.0"
      run_on: ["pull_request"]
    # IMPORTANT: this gate constrains third-party DEPENDENCIES only. It does
    # not restrict a repository's own license — the flagship `jolarca`
    # application is deliberately AGPL-3.0 (repos/jolarca.yml). Do not
    # "remediate" an AGPL finding on jolarca's own LICENSE file.
    scope_note: "inbound dependencies only"

  code_quality:
    id: "code-quality"
    description: "Enforce minimum code quality standards"
    enforcement: "mandatory"
    frameworks: ["soc2", "iso27001", "pci-dss"]
    soc2_controls: ["CC7.1"]
    iso_controls: ["A.8.25"]
    pci_controls: ["6.2.2"]
    implementation:
      tools:
        python:
          - "ruff"
          - "mypy --strict"
          - "pytest --cov --cov-fail-under=80"
        javascript:
          - "eslint"
          - "tsc --noEmit"
        terraform:
          - "terraform fmt -check"
          - "terraform validate"
          - "tflint"
          - "checkov"
      run_on: ["pull_request"]

  sast:
    id: "codeql-analysis"
    description: "CodeQL semantic analysis for security vulnerabilities"
    enforcement: "mandatory"
    frameworks: ["soc2", "iso27001", "pci-dss"]
    soc2_controls: ["CC7.1", "CC7.2"]
    iso_controls: ["A.8.8", "A.8.25"]
    pci_controls: ["6.3.1", "6.3.2"]
    implementation:
      tool: "GitHub CodeQL"
      languages: ["python", "javascript", "typescript"]
      queries: "security-extended"
      fail_on: ["error", "warning"]
      run_on: ["pull_request", "push"]

  iac_scan:
    id: "iac-security"
    description: "Scan Terraform/Kubernetes/Ansible configs for security misconfigurations"
    enforcement: "mandatory_for_tier:governance,devops"
    frameworks: ["soc2", "iso27001", "pci-dss"]
    soc2_controls: ["CC7.1"]
    iso_controls: ["A.8.8"]
    pci_controls: ["6.3.1"]
    implementation:
      tools:
        - "checkov"
        - "tflint"
        - "tfsec"
        - "trivy"
      run_on: ["pull_request"]

  container_scan:
    id: "container-scan"
    description: "Scan container images for OS and dependency vulnerabilities"
    enforcement: "mandatory_for_tier:platform,devops"
    frameworks: ["soc2", "iso27001", "pci-dss"]
    soc2_controls: ["CC7.1"]
    iso_controls: ["A.8.8"]
    pci_controls: ["6.3.1", "6.3.3"]
    implementation:
      tool: "Trivy"
      action: "aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25"  # v0.36.0, SHA-pinned
      fail_on_severity: "HIGH"
      scan_targets: ["os", "library"]
      run_on: ["pull_request"]

  iac_policy:
    id: "iac-policy"
    description: "Enforce organizational policies via OPA/Conftest on Terraform plans"
    enforcement: "mandatory_for_tier:governance,devops"
    frameworks: ["soc2", "iso27001", "pci-dss"]
    soc2_controls: ["CC6.1", "CC8.1"]
    iso_controls: ["A.5.1", "A.8.1"]
    pci_controls: ["1.2.1", "6.3.1"]
    implementation:
      tool: "conftest"
      # Policies live in jolarca-infrastructure/terraform/policies/ — they are
      # infrastructure concerns and stay there. This gate consumes them.
      policy_source: "jolarca-infrastructure:terraform/policies/"
      rules:
        - "no basic IAM roles"
        - "no public IPs"
        - "require CMEK"
      run_on: ["pull_request"]

  plan_review:
    id: "terraform-plan-review"
    description: "Refuse any Terraform plan that destroys, replaces, or changes repository visibility"
    enforcement: "mandatory"
    frameworks: ["soc2", "iso27001", "pci-dss"]
    soc2_controls: ["CC8.1"]
    iso_controls: ["A.8.32"]
    pci_controls: ["6.5.1"]
    implementation:
      # The patterns live in a tested script, not inline in a workflow. They were
      # inline until D-22: the regex was written `visibility\s*:` while `terraform
      # show` emits `visibility = `, so the gate never fired and nothing exercised
      # it. Extraction is what made it testable — record the script, not the caller.
      tool: "scripts/check_plan_safety.sh"
      tested_by: "tests/test_check_plan_safety.sh — 19 fixtures, run by `make test` and compliance-scan.yml; every refusal class has a negative control transcribed from real `terraform show` output, and two allowed-direction controls (no-op refresh, security-feature ENABLING) prove the gate is not a blanket block"
      invoked_by:
        - ".github/workflows/plan.yml — step 'Plan safety check'"
        - ".github/workflows/apply.yml — step 'Refuse destructive or visibility-changing plans' (pre-apply)"
      exit_codes:
        "0": "plan is safe to auto-apply"
        "1": "plan contains a refused action"
        "2": "plan could not be read — cannot-check is NEVER treated as safe"
      blocked_actions:
        - "# <address> will be destroyed"
        - "# <address> must be replaced"
        - "~ visibility = \"public\" -> \"private\" (in-place change, either direction)"
        - "visibility = \"x\" -> \"y\" (defence in depth: transition without a change marker)"
        # Added 2026-10-15 after D-61 proved the four rules above passed a real
        # refreshed plan (`3 to add, 25 to change`) as safe to auto-apply.
        - "# github_branch_protection.<...> will be created (Terraform has never adopted this rule; on 2026-10-15 the three creates were jolarca-consent/-dr/-vendor, where live returns HTTP 404 'Branch not protected', so these ADD protection — a human confirms that is intended rather than an auto-approve landing it)"
        - "~ / - on any protection attribute: require_signed_commits | require_code_owner_reviews | requires_approving_reviews | required_status_checks | required_pull_request_reviews | dismiss_stale_reviews | dismissal_restrictions | require_last_push_approval | required_linear_history | require_conversation_resolution | block_force_pushes | block_deletions | allows_force_pushes | allows_deletions | enforce_admins | strict | lock_branch | restrict_pushes | push_allowances | blocks_creations — either marker, because Terraform renders a REMOVED nested block with `-`: 11 of the 25 changes in the live plan were '- restrict_pushes { … }', deleting the push restriction (D-26 class)"
        - "~ secret_scanning | secret_scanning_push_protection | dependabot_security_updates | vulnerability_alerts -> false|\"disabled\"  (disable direction only; enabling is deliberately allowed)"
        - "~ status = \"enabled\" -> \"disabled\" on a nested block under security_and_analysis — this is how Terraform actually renders the transition, so matching on the feature name alone is inert (measured 2026-10-15)"
      operator_path: >-
        A refusal is not an override. The human reading it chooses one of: import
        the live objects into state (runbook step 6), narrow the declaration, or
        run the apply manually. The gate has no flag to skip it, by design — a
        bypass switch is the thing that made the D-22 inline grep useless.
      compensating_control: "lifecycle { prevent_destroy = true } on every github_repository — verified firing: a plan built from a tree missing repos/*.yml (so every instance plans for deletion) aborted with 'Instance cannot be destroyed' rather than destroying."
      run_on: ["pull_request (path-filtered)", "push to main", "workflow_dispatch"]

  required_context_baseline:
    id: "required-context-baseline"
    description: >-
      The required-status-check baseline in this file's companion policy must
      equal what repos/jolarca-control.yml declares AND what a pull_request can
      actually report.
    enforcement: "mandatory"
    frameworks: ["soc2", "iso27001", "pci-dss"]
    soc2_controls: ["CC8.1"]
    iso_controls: ["A.8.32"]
    pci_controls: ["6.5.1"]
    implementation:
      # Added 2026-10-15 as the enforcement half of D-62. Before this, the
      # baseline named a context no job reports ("Fleet Separation Guard") and
      # omitted a real one ("SAST (semgrep)") for ten days, because nothing
      # compared the three sources. A list that no code reads is a wish.
      tool: "scripts/check_required_context_baseline.py"
      tested_by: "tests/test_check_required_context_baseline.py — 9 cases, run by `make test` and pytest in CI, including the real-repo pass, the literal D-62 defect, empty baseline, a path-filtered workflow, missing/unparseable input exiting 2, and an assertion that the script is wired into a required job"
      invoked_by:
        - ".github/workflows/compliance-scan.yml — job 'Validate Repo Allow-List' (a required context)"
        - "Makefile: `make context-baseline`, in `make lint`"
      exit_codes:
        "0": "baseline, declaration and producible job names agree"
        "1": "mismatch, empty baseline, or a context no pull_request can report"
        "2": "could not verify — an input is missing or unparseable, never a pass"
    remediation:
      - "Fix the baseline or the declaration so they agree; never add a name no workflow reports"
      - "If a check should be required, its workflow must trigger on pull_request with no paths filter"

enforcement_matrix:
  governance:
    required: ["fleet_separation", "dependency_scan", "secret_scan", "license_check", "code_quality", "sast", "iac_scan", "iac_policy", "plan_review", "required_context_baseline"]
    optional: ["container_scan"]
  platform:
    required: ["fleet_separation", "dependency_scan", "secret_scan", "license_check", "code_quality", "sast", "container_scan", "plan_review"]
    optional: ["iac_scan"]
  devops:
    required: ["fleet_separation", "dependency_scan", "secret_scan", "license_check", "code_quality", "sast", "iac_scan", "container_scan", "plan_review"]
    optional: ["iac_policy"]

exceptions:
  process: "Any gate exception must be documented in jolarca-compliance with:"
  requirements:
    - "Risk description and business justification"
    - "Compensating controls"
    - "Time-bound acceptance (max 90 days, then re-evaluate)"
    - "Approval from the organization owner"
    - "Link to the relevant ADR in docs/adr/"
  active:
    - id: "D-91"
      gate: "jolarca-consent ruleset 24087580 required_status_checks omits `Dependency review`"
      risk: >-
        SOC 2 CC8.1 / PCI-DSS Req 6.5.1 — for the duration of this window a pull request to
        jolarca-consent can introduce a dependency with a published vulnerability without a gate
        refusing it, on a repository that handles consent records.
      compensating_control: >-
        Six of the seven required contexts stay enforced on the same ruleset, including
        `Gitleaks (secret scanning)` and `CodeQL (python)`, and the `pull_request` rule is
        untouched, so main remains un-pushable and D-46 stays closed for consent. What is absent
        is dependency-graph gating, not scanning: CodeQL still analyses the tree, `make compliance`
        and the fleet SAST gate are unchanged, and the manifest that makes the check meaningful
        (requirements.txt, 17 pinned entries) is itself the payload of the blocked PR #12.
      approved_by: "Gintaras Kazlauskas"
      approved_on: "2026-10-27"
      # The approval event is the merge of the PR carrying this entry; a dated record is not
      # self-approving. 90 days is the policy maximum above, and the date is deliberately short
      # of a quarter so a forgotten exception cannot quietly become permanent (D-25's shape).
      expires: "2027-01-25"
      exit_trigger: >-
        Re-add the required_check to rulesets.tf AND repos/jolarca-consent.yml in the same PR that
        closes this entry, once consent's main carries a resolvable manifest, `GET
        /repos/jolarca-dev/jolarca-consent/dependency-graph/sbom` exits 0, and `Dependency review`
        has been observed `success` on a consent pull request. AGENTS.md §7: a required check must
        be proven passing, not merely producible.
    - id: "D-58"
      gate: "production apply requires a human approval (deploy-gates / CC8.1-04)"
      risk: >-
        SOC 2 CC8.1 / PCI-DSS Req 6.5.1 — a merge touching repos/**, policy/**, *.tf, *.tfvars or
        apply.yml itself runs `terraform apply -input=false -auto-approve` with no person signing it.
        The environment used to be entirely empty; since D-70 (2026-10-16) it has a 30-minute wait with
        admin bypass off. That is delay plus a cancel window, not approval.
      compensating_control: >-
        wait_timer=30 with can_admins_bypass=false (verified by GET re-read; window proven usable on run
        38813823199, cancelled with steps_started=0) + scripts/check_deploy_gates.py running inside the
        REQUIRED Validate Repo Allow-List job, so an environment that reverts to unprotected fails the
        merge path + check_plan_safety.sh refusals (destroy/replace/visibility/protection-layer/security
        disables, exit 2 on ANSI input) + prevent_destroy on every repository + four required status
        checks with strict=true. The gate deliberately still reports the gap; the allowance below is a
        dated acceptance, not a silencing.
      approved_by: "Gintaras Kazlauskas"
      approved_on: "2026-10-16"
      expires: "2026-11-16"
      exit_trigger: >-
        Add a required reviewer to the `production` environment (Settings -> Environments ->
        production) and remove the ALLOW_UNPROTECTED_* strings from both deploy-gates.yml and
        compliance-scan.yml in the same PR. Do NOT enable "prevent self-review": this organisation has
        one member and that option would wedge every deploy. Whether solo self-approval is otherwise
        permitted is unmeasured and named as the open question in D-58/D-70. On 2026-11-16 the gate goes
        red by itself (D-25) — a lapse is closed by a PR that restates the controls, not by silence.
    - id: "D-04"
      gate: "required_approving_review_count = 0"
      risk: "SOC 2 CC8.1 / ISO 27001 A.8.32 — a single operator can merge their own change without review, bypassing the four-eyes principle."
      compensating_control: "required status checks + signed operator commits + enforce_admins + apply.yml plan-refusal gate + prevent_destroy. CODEOWNERS was removed from this list 2026-09-25: it is configured but inert (D-20), so it compensates for nothing."
      approved_by: "Gintaras Kazlauskas"
      approved_on: "2026-09-25"
      # Every entry here MUST carry an ISO-8601 `expires` date and an
      # `approved_by`. The 90-day rule above is only auditable if the expiry is
      # a DATE: an event-only expiry ("when X happens") has no deadline and can
      # stay open indefinitely, which is precisely how these two entries came to
      # violate the policy they live under (D-25). `exit_trigger` records the
      # intended event; `expires` records when the acceptance lapses regardless.
      # A lapse is closed by a PR that restates the compensating controls — not
      # by silence.
      expires: "2026-12-24"
      exit_trigger: "second-operator onboarding — raise the count to 1 in the same PR that resolves D-20 and replaces the individual CODEOWNERS entries with real jolarca-dev teams"
    - id: "D-05"
      gate: "require_signed_commits = false at branch-protection level"
      risk: "SOC 2 CC6.1 / ISO 27001 A.5.10 — unsigned commits cannot be attributed to a specific operator, so the audit trail for who changed what is weaker than intended."
      compensating_control: "commit_signing_policy in policy/repo-defaults.yml; only provider automation is exempt"
      approved_by: "Gintaras Kazlauskas"
      approved_on: "2026-09-25"
      expires: "2026-12-24"
      exit_trigger: "provider-seeded automation commits become signable"
    - id: "D-07"
      gate: "tag_protection.enforced = false — release tags can be moved or deleted"
      risk: "SOC 2 CC8.1 / ISO 27001 A.8.32 — the release-to-commit audit trail can be rewritten after the fact, and this control plane cannot currently detect that it was."
      compensating_control: "Squash-only linear history with required conversation resolution; every merge is a PR carrying a recorded plan. Tag mutation remains undetected."
      approved_by: "Gintaras Kazlauskas"
      approved_on: "2026-09-25"
      expires: "2026-12-24"
      # Not a soft target. Verified 2026-09-25: org-level rulesets return
      # HTTP 403 "Upgrade to GitHub Team" (the org is on the Free plan) and the
      # classic /tags/protection API returns HTTP 404 — GitHub removed it.
      # Repository rulesets also require Team or higher once a repo is PRIVATE,
      # which is the intended end state for five of six repos. So this exception
      # cannot be closed by configuration alone; it needs a plan decision.
      exit_trigger: "GitHub Team plan (or higher) enabled on jolarca-dev, then a github_repository_ruleset protecting refs/tags/v*"
      blocked_by: "plan tier — see docs/drift-findings.md D-07"
    - id: "D-33"
      gate: >-
        branch protection unenforceable on every PRIVATE repository. The same plan
        tier also blocks GitHub secret scanning, push protection, Dependabot
        security updates and CodeQL code scanning on private repos (readiness-gate
        findings G-05, G-06, G-07, G-14). Upgrading unblocks all of them at once.
      risk: >-
        SOC 2 CC6.1 / CC8.1, ISO 27001 A.5.1 / A.8.32, PCI-DSS Req 6.3 / 6.5.
        `main` on the private fleet can be force-pushed, deleted or pushed to
        directly — no review, no required check, no admin enforcement. Because a
        history rewrite also destroys signed-commit attribution, the compensating
        control cited by D-04 and D-05 is itself unguarded. Proven by behaviour,
        not inferred: commit 02b05f3 deleted .github/CODEOWNERS directly on
        jolarca-compliance `main` on 2026-09-25 — no PR, no review, unsigned,
        under a message claiming to enforce that file — and nothing blocked it.
      compensating_control: >-
        IN PLACE (verified 2026-09-28): merges taken as squash-only PRs by
        convention (jolarca-compliance PRs #13, #14, #15); every operator commit
        GPG-signed; gitleaks pinned to 8.30.1 identically in CI, pre-commit and
        locally, scanning both the working tree and full history, guarded by a
        NEGATIVE CONTROL that fails the build if the ruleset is ever emptied;
        Dependabot alerts enabled (HTTP 204); policy-mandated .gitignore patterns
        restored. NOT IN PLACE — all four interim controls D-33 requires are still
        outstanding: (1) drift_detect.py does not read `.protected` and still files
        the private-repo 403 as `unverifiable`, so the mandated "a repository lost
        branch protection" signal cannot fire; (2) the public repos are unprotected
        too — `enable_branch_protection = false` remains in terraform.tfvars;
        (3) PR-by-convention is unenforced and bypassable without trace;
        (4) no off-host state backup exists (D-02), so rewritten history would be
        unrecoverable. This acceptance is therefore CONDITIONAL and the D-33 row is
        deliberately retained in open_blocking below until all four are stood up.
      approved_by: "Gintaras Kazlauskas"
      approved_on: "2026-09-28"
      expires: "2026-12-27"
      exit_trigger: >-
        GitHub Team enabled on jolarca-dev, then `enable_branch_protection = true`
        with branch-protection.tf reconciled against policy/repo-defaults.yml
        BEFORE apply (otherwise D-26's `weakened` check fires immediately), the two
        surviving rules imported on `jolarca` and `.github`, and secret scanning
        plus CodeQL enabled across the private fleet.
      blocked_by: "plan tier — see docs/drift-findings.md D-33"
    - id: "payments-public"
      gate: >-
        PCI-DSS-scoped repo (jolarca-payments) declared public. The
        validate_repos.py guard fires only when launch_status is `operational`;
        payments is currently `planned`. This acceptance pre-positions the
        override so the transition to operational does not silently block.
      risk: >-
        PCI-DSS Req 1.2 — public readability of payment processing architecture
        widens the attack surface. Mitigated by data_classification: internal
        (no regulated data in the repo itself; payment secrets and cardholder
        data live in runtime, not in git).
      compensating_control: >-
        data_classification: internal; payment secrets never committed to git
        (gitleaks + secret_scan gate); the repo holds integration code and
        PCI-DSS documentation, not cardholder data. validate_repos.py guard
        prevents any FUTURE PCI-DSS operational repo from going public without
        the same documented_risk_acceptance pattern.
      approved_by: "Gintaras Kazlauskas"
      approved_on: "2026-09-30"
      expires: "2026-12-29"
      exit_trigger: >-
        jolarca-payments promoted to operational launch_status AND either (a)
        flipped private, or (b) risk acceptance re-authorised with fresh
        90-day expiry. Any new PCI-DSS operational public repo requires its
        own entry.
    - id: "control-plane-public"
      gate: >-
        PCI-DSS-scoped operational repo (jolarca-control) declared public.
        The governance control plane is deliberately public per ADR-0007 so
        the IaC, policy baselines and audit trail are externally verifiable.
      risk: >-
        PCI-DSS Req 1.2 — public readability of the control plane exposes
        branch-protection contexts, repo inventory and policy baselines.
        Mitigated by data_classification: internal; no regulated data, secrets
        or cardholder data lives in this repo.
      compensating_control: >-
        ADR-0007 documents the deliberate public visibility. gitleaks +
        secret_scan gate prevent secrets entering git. The control plane
        holds Terraform definitions and YAML declarations, not payment data.
      approved_by: "Gintaras Kazlauskas"
      approved_on: "2026-09-30"
      expires: "2026-12-29"
      exit_trigger: >-
        jolarca-control flipped private (would require ADR-0007 reversal)
        or risk acceptance re-authorised with fresh 90-day expiry.
    - id: "fleet-public-2026-10"
      gate: >-
        GitHub is migrating all jolarca-dev repos to public within 10 days.
        Three PCI-DSS-scoped operational repos (jolarca-compliance,
        jolarca-infrastructure, jolarca-legal) are now declared public.
      risk: >-
        PCI-DSS Req 1.2 — public readability widens attack surface for
        compliance, infrastructure and legal content. Mitigated by
        data_classification: internal (downgraded from confidential since
        the content is now world-readable by force).
      compensating_control: >-
        validate_repos.py guard prevents future PCI-DSS operational repos
        from going public without documented_risk_acceptance. gitleaks +
        secret_scan gate prevent secrets entering git. All repos now
        declared public with internal classification.
      approved_by: "Gintaras Kazlauskas"
      approved_on: "2026-09-30"
      expires: "2026-12-29"
      exit_trigger: >-
        Repos flipped back to private, or risk acceptance re-authorised
        with fresh 90-day expiry.
    - id: "contact-alias-interim"
      gate: >-
        Published security, privacy and organisation contacts are Gmail
        plus-aliases on one personal mailbox instead of role mailboxes on a
        domain the organisation controls. Accepted because the alternative on
        2026-10-15 was worse: every address previously published
        (security@jolarca.com, legal@jolarca.com, security@jolarca.dev,
        legal@jolarca.dev) is undeliverable, so the disclosure channel named in
        SECURITY.md across the fleet reached nobody.
      risk: >-
        GDPR Art. 12/38, SOC 2 CC2.2/CC7.x, ISO 27001 A.5.1. Data-subject
        requests, vulnerability reports and billing notices all terminate in a
        single mailbox behind one credential: intake cannot be shown to be
        handled independently, retention cannot differ per role, and loss or
        compromise of that one account takes every role contact at once. A
        plus-alias also discloses the base mailbox name to anyone reading it.
        This register entry therefore authorises ROUTING ONLY. It must not be
        cited as segregation of duties or as an independent DPO function.
      compensating_control: >-
        VERIFIED IN PLACE: policy/contact-addresses.yml is the single definition
        of which address serves which role, and names the dead addresses that
        must not be republished; the GitHub organisation `billing_email` and
        profile `email` are set to the github-operations alias and re-read live
        (gh api orgs/jolarca-dev, 2026-10-15); commit authorship on this host
        uses 227570927+JourneyOfLife@users.noreply.github.com, so no new commit
        in any public fleet repo carries the base address; the base mailbox is
        deliberately not re-spelled in the new policy file (public repository).
        NOT IN PLACE: no automated gate compares live SECURITY.md content
        against policy/contact-addresses.yml (convention-only), no inbound test
        message has proven delivery to any alias yet, the org `.github` copy of
        SECURITY.md and four sibling repos still name the dead addresses, and
        the GitHub account itself has only the base address on file (primary,
        verified, public). REGRESSION INTRODUCED BY THIS ACCEPTANCE (measured on
        the first commit under the new identity, `.commit.verification`):
        commits authored by the noreply address report `verified: false, reason:
        "bad_email"` because GitHub verifies a signature only against emails
        registered on the account — so signed-commit attribution (D-05, PCI-DSS
        Req 8.2) is weaker until the noreply address is added in Settings →
        Emails. One UI action, no key rotation.
      related_finding: "docs/drift-findings.md D-59 and D-60; commit_identity.verification_gap in policy/contact-addresses.yml"
      approved_by: "Gintaras Kazlauskas"
      approved_on: "2026-10-15"
      # Recorded under the owner's standing delegation of 2026-10-15 ("consider
      # it in your professional opinion, change and fix"). AGENTS.md §1 says an
      # approval exists only in a dated record, so the delegation is written
      # here rather than left in a chat transcript.
      expires: "2027-01-13"
      exit_trigger: >-
        MX, DMARC and SPF/DKIM published for jolarca.com with deliverable
        security@ / privacy@ / billing@ role mailboxes; one inbound test message
        per role proven and its headers retained as hashed evidence; SECURITY.md
        in `.github` plus the sibling repos repointed to policy/contact-addresses.yml;
        the Gmail aliases reduced to forwarding and the base mailbox removed from
        GitHub account public visibility.

  # Findings that are NOT accepted exceptions. Listed here so this file cannot
  # be read as a clean bill of health: an exception register that only records
  # what has been accepted hides what is still broken. Each of these blocks the
  # first apply. Details and evidence: docs/drift-findings.md.
  open_blocking:
    - id: "D-61"
      issue: >-
        The pre-apply plan_review gate (scripts/check_plan_safety.sh) exits 0 —
        "safe to auto-apply" — on a refreshed plan containing 3 branch-protection
        creations and 25 fleet-wide setting changes. Its refusal on the same
        commit under -refresh=false came from 5 stale visibility diffs, not from
        detecting danger. What prevents an unattended apply today: the CI plan step
        failing on the state lock (D-56, a broken automation, not a control) and —
        since 2026-10-16 — a 30-minute deployment wait timer on the `production`
        environment with `can_admins_bypass: false` (D-70), which is delay for a human
        to cancel, not approval.
      owner_decision_required: >-
        Reconcile branch-protection declarations with the live rules
        (docs/state-migration-runbook.md step 6) and require a refreshed plan to read
        0 to add / 0 to change BEFORE merging anything on an apply.yml trigger path
        (repos/**, policy/**, *.tf, *.tfvars, apply.yml itself).
        DONE 2026-10-16: the deployment wait timer half is stood up —
        `gh api -X PUT repos/jolarca-dev/jolarca-control/environments/production
        -F wait_timer=30 -F can_admins_bypass=false` (note `-F`, not `-f`: that field
        is an integer and this one a boolean; `-f` returns HTTP 422 and changes
