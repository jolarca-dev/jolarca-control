# ──────────────────────────────────────────────────────────────────────────────
# Jolarca Repository Defaults — enforced baseline for EVERY marketplace repo
# ──────────────────────────────────────────────────────────────────────────────
# Org:        jolarca-dev (marketplace tree — ADR-0004)
# Owner:      jolarca-dev organization owner (single-operator era)
# Compliance: SOC 2 Type II · GDPR · ISO 27001:2022 · PCI-DSS 4.0
# Review:     Quarterly or on material change
#
# Every value here was verified against the live GitHub API on 2026-09-25.
# Where the baseline records a DEVIATION from the equivalent jol-control
# policy, the deviation is registered in docs/drift-findings.md (D-nn) — this
# file is read by scripts/validate_repos.py and scripts/compliance_check.py,
# so a deviation recorded here is a deviation the validators accept.
# ──────────────────────────────────────────────────────────────────────────────

metadata:
  version: "1.0.0"
  last_reviewed: "2026-09-25"
  next_review: "2026-12-25"
  owner: "jolarca-dev organization owner"
  approved_by: "Gintaras Kazlauskas"
  scope: "marketplace (jolarca*) — never mission-platform (jol-*) repos"

# ── Repository-level settings applied to ALL repos ──────────────────────────
repository_defaults:
  # No blanket license: only the flagship `jolarca` application carries one
  # (AGPL-3.0, deliberate). Governance repos declare none.
  license: null
  has_issues: false            # verified live; jolarca-control overrides to true
  has_wiki: false
  has_projects: false
  has_discussions: false
  delete_branch_on_merge: true
  allow_merge_commit: false    # squash-only keeps a linear, auditable history
  allow_squash_merge: true
  allow_rebase_merge: false    # verified live across the whole fleet
  allow_auto_merge: false
  auto_init: false
  archived: false
  is_template: false
  vulnerability_alerts: true
  secret_scanning: true
  secret_scanning_push_protection: true
  dependabot_alerts: true
  dependabot_security_updates: true

# ── Branch protection — main branch (applies to ALL repos) ──────────────────
branch_protection:
  main:
    pattern: "main"
    required_status_checks:
      strict: true
      # Contexts are per-repo (declared in repos/*.yml) because each repo runs
      # a different pipeline. What is NOT negotiable: the list must never be
      # empty — a protected branch with zero required contexts enforces
      # nothing, which is how unreviewed code reached main before the
      # 2026-09-17 delivery-chain audit.
      minimum_contexts: 1
    required_pull_request_reviews:
      # DEVIATION D-04 — solo-era. Verified 0 on all six repos, 2026-09-25.
      # Raise to 1 when the second operator onboards.
      required_approving_review_count: 0
      dismiss_stale_reviews: true
      # TRUE on all five jolarca* repos, but INERT — see D-20. The fleet's
      # .github/CODEOWNERS reference teams that do not exist in jolarca-dev
      # (zero teams) and five of six name mission-org teams, breaching ADR-0004
      # R4. Verified: PR #26 merged with zero reviews. Declared as live reality
      # so migration is a no-op; NOT an operating control.
      require_code_owner_reviews: true
      require_last_push_approval: false
    enforce_admins: true
    restrict_pushes: true
    # DEVIATION D-05 — GitHub-side signature enforcement is OFF because
    # provider-seeded automation commits (github_repository_file) cannot be
    # GPG-signed. Human operators still sign by policy; see below.
    require_signed_commits: false
    require_linear_history: true
    require_conversation_resolution: true
    block_force_pushes: true
    block_deletions: true
    tag_protection:
      # Not yet enforced — verified NO rulesets exist org-wide (D-07).
      pattern: "v*"
      enforced: false

# Commit signing remains MANDATORY for human operators even though GitHub-side
# enforcement is off (D-05). Signed commits are the compensating control for
# the 0-review deviation (D-04): they attribute every change to a key holder.
commit_signing_policy:
  required_for_human_operators: true
  mechanism: "git commit -S (GPG key registered on the GitHub account)"
  exemption: "Terraform-provider automation commits only (jolarca-control-automation)"

# ── Required CI checks ───────────────────────────────────────────────────────
required_checks:
  pre_merge:
    - context: "per-repo pipeline (see repos/*.yml)"
      description: "Every repo declares its own required contexts; the set must not be empty"
    - context: "dependency-review"
      description: "No known-vulnerable dependencies introduced"
    - context: "gitleaks"
      description: "No secrets in the diff"
  control_plane:
    - context: "Validate Repo Allow-List"
      description: "repos/*.yml passes scripts/validate_repos.py"
    - context: "Policy Compliance Check"
      description: "scripts/compliance_check.py returns overall_status=pass"
    - context: "Repository Secret Pattern Scan"
      description: "Secret-pattern sweep over the control plane itself"
    - context: "Fleet Separation Guard"
      description: "ADR-0004 R1/R2/R3 — org jolarca* set == allow-list"

# ── Team access ──────────────────────────────────────────────────────────────
# VERIFIED 2026-09-25: jolarca-dev has NO teams. All access is via org
# ownership by the single operator. Declared empty on purpose — do not invent
# teams here. See docs/drift-findings.md D-10.
teams: {}

# ── Asset inventory attributes (ISO 27001 A.5.9 / SOC 2 CC6.1) ────────────────
# repos/*.yml IS the asset inventory. An inventory that records what a system is
# but not how much it matters cannot be used to prioritise an incident or scope
# an audit, so every entry also carries `criticality` and `launch_status`.
#
# Both vocabularies are CLOSED and enforced by scripts/validate_repos.py. The
# rubric is what makes the assignment auditable: a reviewer can check a repo's
# tier against the definition instead of against the author's mood. Changing a
# tier is a Normal change under docs/change-management.md and needs a rationale.
asset_inventory:
  criticality:
    tier-1: "Compromise, loss or unavailability directly exposes customer PII, payment data, or the controls that protect them. Incident response is immediate and may be reportable under GDPR Art. 33 / PCI-DSS Req 12.10."
    tier-2: "Compromise or loss degrades the compliance, legal or contractual position but does not by itself expose regulated data at rest. Response within one business day."
    tier-3: "Internal tooling or reference documentation. Loss is recoverable from history; holds no regulated data."
  launch_status:
    planned: "Declared in the allow-list but not yet created on GitHub, or created and still empty."
    in-development: "Content exists and CI runs, but nothing depends on it in production yet."
    operational: "Actively relied on — production infrastructure, or the authoritative record for a live legal/compliance obligation."
    retired: "Kept as evidence only; archived, no further changes expected."

# ── Organization-level baseline ──────────────────────────────────────────────
# Org owner settings that the integrations/github provider CANNOT manage, so
# scripts/drift_detect.py is the only control that verifies them. Each desired
# value below is paired with its live value as of 2026-09-25 and the finding
# that tracks the gap — do not relax a value here without a recorded decision
# in docs/drift-findings.md and an entry in compliance-gates.yml
# exceptions.active.
#
# A mismatch here is reported as drift, NOT auto-remediated: these settings
# require an org owner and cannot be changed by the control plane.
organization_baseline:
  # PCI-DSS 8.3.1 / SOC 2 CC6.1 / ISO 27001 A.5.17. Live: false (D-18).
  two_factor_requirement_enabled: true
  # ADR-0004 R2: out-of-band repo creation must be prevented, not just
  # detected. Org owners keep creation rights, so the control plane is
  # unaffected. Live: true (D-19).
  members_can_create_repositories: false
  members_can_create_public_repositories: false
  members_can_create_private_repositories: false
  # PCI-DSS Req 7 least privilege: `read` grants every member read on every
  # repo automatically. Live: "read" (D-19).
  default_repository_permission: "none"
  # Live: false (both fork settings). Kept false — private-repo forking would
  # copy PCI-scoped content outside this control plane's jurisdiction.
  members_can_fork_private_repositories: false
  # Commit sign-off at the web UI level. Live: false (D-21).
  web_commit_signoff_required: true

  # Humans permitted to hold admin on any fleet repository. Solo-operator era
  # (D-10): exactly one. Any other admin is an "unexpected admin" alert — the
  # control plane cannot tell a legitimate invitation from a compromised one,
  # so it surfaces the difference and a human decides.
  allowed_admins:
    - JourneyOfLife

  # Branch-protection attributes that must hold on every allow-list repo's
  # default branch. Compared against the live protection rule; a repo with NO
  # protection rule at all is reported as `protection_missing`, which is the
  # most severe outcome because it means the repo is unguarded entirely.
  required_branch_protection:
    enforce_admins: true
    allow_force_pushes: false
    allow_deletions: false
    require_code_owner_reviews: true
    dismiss_stale_reviews: true
    minimum_required_contexts: 1

  # Repos whose protection rule is deliberately minimal. A rule must still
  # EXIST — only the attribute baseline above is skipped, so this can never be
  # used to leave a repo unprotected. `.github` is a content-only
  # community-health repo with no CI; requiring status-check contexts there
  # would block every change forever (see github_branch_protection.health in
  # branch-protection.tf).
  branch_protection_baseline_exempt:
    - .github

# ── Data handling ────────────────────────────────────────────────────────────
data_handling:
  classification_required: true
  # Enforced by scripts/validate_repos.py: confidential/restricted data may not
  # sit in a public repository. This is the control that makes D-01 visible.
  max_classification_for_public: "internal"
  secrets_in_git: "prohibited"
  terraform_state_in_git: "prohibited"
  required_gitignore_patterns:
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "secrets.json"
    - "credentials.json"
    - ".env"
    - ".env.*"
    - "*.tfstate"
    - "*.tfstate.*"
    - ".terraform/"

# ── Compliance framework mapping ─────────────────────────────────────────────
compliance_mapping:
  soc2:
    CC6_1: "Branch protection + required status checks + CODEOWNERS"
    CC6_2: "Signed commits by operator policy (D-05 compensating control)"
    CC6_3: "Secret scanning + push protection"
    CC6_6: "Fleet separation guard — logical boundary between scopes"
    CC7_1: "Dependency scanning on every PR"
    CC7_2: "CodeQL / trivy / gitleaks on every PR"
    CC8_1: "Change management via PR + squash-only linear history + audit trail"
    CC9_2: "Drift detection against the declared allow-list"
  gdpr:
    Art5_1_f: "Integrity and confidentiality — visibility coherence check"
    Art25: "Data classification required per repo"
    Art30: "Processing records in jolarca-compliance (RoP/ERoPA)"
    Art32: "Security gates enforced via CI"
    Art33: "Breach notification path in jolarca-compliance"
  iso27001:
    A_5_1: "Policy baselines in policy/"
    A_5_3: "Segregation of duties — ADR-0004 mission/marketplace split"
    A_5_10: "Acceptable use — no secrets and no state in git"
    A_5_9: "Inventory of information — repos/*.yml IS the asset inventory"
    A_6_1: "Access control (org ownership; no teams yet — D-10)"
    A_8_1: "User endpoint devices — see jolarca-infrastructure security/"
    A_8_8: "Management of technical vulnerabilities — Dependabot + scanners"
    A_8_13: "Information backup — state backup is runbook step 0"
    A_8_19: "Installation of software on operational systems"
    A_8_32: "Change management — docs/change-management.md"
  pci_dss:
    Req_1_2: "Scope definition — data classification ↔ visibility coherence"
    Req_6_3: "Change control — PR + protected branch + plan review gate"
    Req_6_5: "Secure development — SAST and dependency gates"
    Req_8_2: "Unique identification — signed commits attribute every change"
    Req_10_2: "Audit logs — org audit-log streaming webhook (org-settings.tf)"
    Req_12_10: "Incident response — see jolarca-compliance"
