# compliance-scan.yml — mandatory compliance checks for every PR.
#
# jolarca-control — marketplace (jolarca-dev) governance control plane.
# SOC 2 CC7.1/CC7.2 · ISO 27001 A.8.8/A.8.25 · PCI-DSS 6.3
#
# This workflow produces three of the FOUR required status check contexts declared
# in repos/jolarca-control.yml branch_protection.main.required_status_checks:
#   1. "Validate Repo Allow-List"        — scripts/validate_repos.py +
#                                          scripts/check_required_context_baseline.py (D-62) +
#                                          scripts/check_declared_contexts.py (D-67) +
#                                          scripts/check_deploy_gates.py (D-58) +
#                                          scripts/check_findings_register.py (A-07)
#   2. "Policy Compliance Check"         — scripts/compliance_check.py
#   3. "Repository Secret Pattern Scan"  — gitleaks (full history)
#   4. "SAST (semgrep)"                  — .github/workflows/sast.yml (A-08, 2026-10-08)
# The header said "THREE" until this correction, nine days after the fourth became required:
# the same stale-control-count class as D-62 and D-63, caught while wiring a step into this job.
#
# Additional jobs (tests, lint) run alongside but are NOT branch protection
# contexts — they are defense in depth.
#
# SAST (Semgrep / Bandit / Trivy config) MOVED OUT of this file 2026-10-08
# under A-08: it now lives in .github/workflows/sast.yml, where the gate can
# be wired as a required status check and enforced declaratively by
# compliance_check.py. Bandit previously ran here as a non-required job
# whose "mandatory" policy declaration was not actually checked by anything.
#
# All actions SHA-pinned per policy/compliance-gates.yml B5.
# ─────────────────────────────────────────────────────────────────────────────

name: Compliance Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # A-07: check_findings_register.py --cross-pr enumerates open PRs via
  # `gh api repos/{owner}/{repo}/pulls?state=open` to catch a finding-id collision against a
  # sibling branch before either merges. Read-only; no write scope is granted. It is NOT
  # used by the required step below -- see the reason there (an unrelated open branch would
  # otherwise redden every merge); `make findings-check` runs the cross-PR form locally.
  pull-requests: read

jobs:
  # ── Context 1: Validate Repo Allow-List ────────────────────────────────────
  validate:
    name: Validate Repo Allow-List
    runs-on: ubuntu-latest
    # `actions: read` is added at job level because the step below reads the live
    # `environment:` protection rules through the environments API; contents stays read-only.
    # Measured in #41's own CI history: the script can only print the live exemption once the
    # token reaches the environment object.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/validate_repos.py
      # D-62: this job's own name is a required status check, and the policy
      # baseline in policy/repo-defaults.yml used to name a context no workflow
      # reports while omitting SAST (semgrep). Nothing compared them, so the
      # baseline rotted while reading as authoritative. Fixtures in
      # tests/test_check_required_context_baseline.py.
      - run: python3 scripts/check_required_context_baseline.py
      # D-67: the check that catches "a required status check no workflow can report" used
      # to live only in context-parity.yml, which is path-filtered and NOT one of the four
      # required contexts — so it could describe a merge-killing declaration and still let
      # the PR merge (it did: repos/jolarca-identity.yml declares ci/security/lint while the
      # repo reports 'gitleaks (full history)'/shellcheck, and the plan carried
      # `+ required_status_checks` for it). Running it here puts the same verdict on the
      # merge path. Every allow-listed repo is public, so the job's own GITHUB_TOKEN can
      # read their workflow files. Trade-off, stated rather than hidden: this step reads the
      # live API, so a GitHub outage makes a required context red and blocks merges until a
      # re-run — deliberate, because the script exits 2 ("could not verify") rather than
      # passing on an unread repo (§3, D-23), and a silently-skipped gate is the failure this
      # repo keeps recording. context-parity.yml is kept as the early, path-filtered signal.
      - name: Declared required checks must be reportable (fleet)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_MISSING_REPOS: ""
        run: python3 scripts/check_declared_contexts.py
      # D-58 / D-67: a job that names `environment: production` claims a gate. This asserts the gate
      # exists instead of trusting a header comment -- the header said "manual approval gate" while the
      # environment had protection_rules: [] and can_admins_bypass: true (measured 2026-10-05).
      # Since D-70 (2026-10-16) there IS a rule: wait_timer=30 with admin bypass off, which the script
      # still reports as a finding because delay is not approval. The dated allowance below mirrors
      # deploy-gates.yml and is recorded in policy/compliance-gates.yml exceptions.active; it is not a
      # way to make the check quiet -- an expired allowance fails again by itself (D-25). Advisory
      # alone was not enough: this same class of check was exempting the very repos it was failing for.
      - name: Deployment environment gates are real (D-58)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_UNPROTECTED_ENVS: "jolarca-dev/jolarca-control:production"
          ALLOW_UNPROTECTED_UNTIL: "2026-11-16"
        run: python3 scripts/check_deploy_gates.py
      # A-07 / D-71: the register is referenced by id from SECURITY.md, audit/*.yml, the threat
      # model, Terraform comments and policy/compliance-gates.yml, so a duplicated `### D-nn` corrupts
      # every one of those paths. Measured twice: PR #41 and main both produced a `### D-52` for
      # different findings (2026-10-05), and PR #67 and #41 both claimed `D-58` on 2026-10-16 — caught
      # by this guard on its first run. Before it existed, allocating D-69 needed a hand-run grep.
      # Runs inside a REQUIRED context so a collision blocks the merge rather than decorating the
      # checks tab (D-67's lesson); exit codes stay 0/1/2 and an unparseable register is 2, never a
      # pass (D-23).
      # Deliberately WITHOUT --cross-pr: cross-PR comparison would make a required context depend on
      # the contents of unrelated open branches -- one of them can redden every merge, and the author
      # under review usually cannot fix it. Intra-file duplication is what corrupts the register, and
      # that is what is enforced here. The cross-PR view stays local as `make findings-check`.
      - name: Finding IDs must be unique (register integrity)
        run: python3 scripts/check_findings_register.py

  # ── Context 2: Policy Compliance Check ─────────────────────────────────────
  compliance:
    name: Policy Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/compliance_check.py

  # ── Context 3: Repository Secret Pattern Scan ──────────────────────────────
  # The full readiness audit (scripts/repo_readiness_audit.py) checks local
  # state that differs between CI and a developer machine (git config,
  # branch state, CODEOWNERS resolution). Running it as a required context
  # deadlocked the merge gate. The secret scan itself is simpler: gitleaks
  # covers tracked files AND history with the project's .gitleaks.toml.
  secret-scan:
    name: Repository Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GL_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
      - name: Run gitleaks (full history)
        run: gitleaks git . --no-banner --redact

  # ── Regression tests ───────────────────────────────────────────────────────
  test:
    name: Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: bash tests/test_check_plan_safety.sh
      # D-02: the backup tool's fixtures are shell, not pytest, and this job is a
      # required context — so a regression that leaves the fleet with no verified
      # state export fails here rather than during a restore. Offline: the cases
      # generate an ephemeral age keypair and point the backend at a closed port.
      - name: Install age
        # The fixtures below generate an ephemeral recipient/identity, so the tool
        # has to be installed first and explicitly: a job that quietly skips when a
        # dependency is missing reports green while checking nothing
        # (test_ci_gates_are_real.py exists for exactly this class).
        run: sudo apt-get update -q && sudo apt-get install -yq age
      - name: State backup fixtures
        run: bash tests/test_state_backup.sh
      # Named step, and no fallback: a runner has no .venv here (no workflow builds one and
      # .gitignore excludes it), so the previous `.venv/bin/python ... || python ...` always fell
      # through and the fallback owned the verdict. requirements-dev.txt pins pytest exactly and is
      # installed into this interpreter by the step above, so `python` IS the pinned environment.
      # Guarded by tests/test_ci_steps_are_real.py.
      - name: Regression tests
        run: python -m pytest tests/ -q

  # ── Lint (ruff + shellcheck + yamllint) ────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts/ tests/
      - run: ruff format --check scripts/ tests/
      - run: mypy
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -yq shellcheck
      - run: shellcheck -x scripts/*.sh tests/*.sh
      - run: yamllint -c .yamllint .

  # ── Terraform format check ─────────────────────────────────────────────────
  terraform:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
