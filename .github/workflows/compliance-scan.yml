# compliance-scan.yml — mandatory compliance checks for every PR.
#
# jolarca-control — marketplace (jolarca-dev) governance control plane.
# SOC 2 CC7.1/CC7.2 · ISO 27001 A.8.8/A.8.25 · PCI-DSS 6.3
#
# This workflow produces the THREE required status check contexts declared
# in repos/jolarca-control.yml branch_protection.main.required_status_checks:
#   1. "Validate Repo Allow-List"        — scripts/validate_repos.py
#   2. "Policy Compliance Check"         — scripts/compliance_check.py
#   3. "Repository Secret Pattern Scan"  — scripts/repo_readiness_audit.py --no-live
#
# Additional jobs (tests, lint, SAST) run alongside but are NOT branch
# protection contexts — they are defense in depth.
#
# All actions SHA-pinned per policy/compliance-gates.yml B5.
# ─────────────────────────────────────────────────────────────────────────────

name: Compliance Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Context 1: Validate Repo Allow-List ────────────────────────────────────
  validate:
    name: Validate Repo Allow-List
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/validate_repos.py

  # ── Context 2: Policy Compliance Check ─────────────────────────────────────
  compliance:
    name: Policy Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/compliance_check.py

  # ── Context 3: Repository Secret Pattern Scan ──────────────────────────────
  secret-scan:
    name: Repository Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.3.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run readiness gate secret sweep (offline, no-live)
        run: python3 scripts/repo_readiness_audit.py --repo jolarca-control --no-live >/dev/null

  # ── Regression tests ───────────────────────────────────────────────────────
  test:
    name: Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: bash tests/test_check_plan_safety.sh
      - run: .venv/bin/python -m pytest tests/ -q || python -m pytest tests/ -q

  # ── Lint (ruff + shellcheck + yamllint) ────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts/ tests/
      - run: ruff format --check scripts/ tests/
      - run: mypy
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -yq shellcheck
      - run: shellcheck -x scripts/*.sh tests/*.sh
      - run: yamllint -c .yamllint .

  # ── SAST: bandit (Python security lint) ────────────────────────────────────
  # A3 remediation: SAST was declared mandatory but never verified. CodeQL
  # needs GHAS on private repos; bandit runs today on public repos with no
  # license dependency. Semgrep/Bandit/Trivy per A3 options.
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r scripts/ -ll -ii

  # ── Terraform format check ─────────────────────────────────────────────────
  terraform:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.3.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
