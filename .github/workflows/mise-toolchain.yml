name: mise toolchain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mise-toolchain:
    name: mise toolchain (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verified mise and locked tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.25
          sha256: 5d362ecc578dc7c146679b841dda949d6472cbf86ff5635db7afdca1b6b3fd87
          install_args: --locked
          cache: false
          env: false
      - name: Print selected tool versions
        run: mise run toolchain
      - name: Confirm installation did not change configuration
        run: git diff --exit-code -- mise.toml mise.lock

  # ADR-0010 M-01 and M-02: the two controls above bind the job, not the repository.
  # This job proves the repository-level bound actually refuses. It is a refusal test,
  # so every assertion here is written to fail loudly rather than to pass quietly:
  # a guard that only checks "the decoy is absent" would also pass when mise printed
  # nothing at all. Each leg therefore has an opposite leg that must succeed.
  mise-config-scope:
    name: mise config scope guard (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verified mise and locked tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.25
          sha256: 5d362ecc578dc7c146679b841dda949d6472cbf86ff5635db7afdca1b6b3fd87
          install_args: --locked
          cache: false
          env: false
      - name: Show what mise loaded and what it trusts
        run: |
          mise --version
          echo "--- mise trust --show ---"
          mise trust --show || true
          echo "--- mise config ---"
          mise config || true
      - name: Plant a decoy config one directory above the repository
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          printf '[tools]\nbidi-decoy = "9.9.9"\n' > "$parent/mise.toml"
          echo "planted: $parent/mise.toml"
          ls -l "$parent"
      - name: Leg 1 - unbounded search MUST see the decoy (proves the guard is not vacuous)
        env:
          MISE_CEILING_PATHS: ""
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          out="$(mise config 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -qF "$parent/mise.toml"; then
            echo "OK: with no ceiling, mise discovers the parent config. Leg 2 is therefore meaningful."
          else
            echo "::error::the decoy is invisible even unbounded, so this runner proves nothing about ceiling_paths"
            exit 1
          fi
      - name: Leg 2 - the repository .miserc.toml MUST hide the decoy
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          out="$(mise config 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -qF "$parent/mise.toml"; then
            echo "::error::ceiling_paths failed open: mise still loads a config above the repository"
            exit 1
          fi
          if ! echo "$out" | grep -qF "$GITHUB_WORKSPACE/mise.toml"; then
            echo "::error::mise loaded no repository config, so a silent refusal is being reported as safety"
            exit 1
          fi
          echo "OK: repository config loaded, nothing above it."
      - name: Leg 3 - plain "mise install" honours [tool_config] locked = true
        run: |
          set -euo pipefail
          # Positive leg first: the unmodified pair must install from the lockfile with no
          # --locked flag anywhere. Without this, Leg 4 could pass for an unrelated reason.
          mise install
          echo "OK: plain mise install resolved from the committed lockfile."
      - name: Leg 4 - a version absent from the lockfile MUST be refused without --locked
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp mise.toml mise.lock .miserc.toml "$work"/
          # A real release that is NOT the locked one: if locked mode is not binding, mise
          # resolves and downloads it and this control fails with evidence, not silence.
          sed -i 's/^python = .*/python = "3.12.15"/' "$work/mise.toml"
          cd "$work"
          mise trust . >/dev/null 2>&1 || true
          out="$(MISE_DATA_DIR="$(mktemp -d)" mise install python 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -qiE 'lock'; then
            echo "OK: refused against the lockfile, which is what [tool_config] locked = true must do."
          else
            echo "::error::plain mise install did not refuse a version missing from mise.lock - locked mode is not enforced by the repository"
            exit 1
          fi
