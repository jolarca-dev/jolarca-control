name: mise toolchain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mise-toolchain:
    name: mise toolchain (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verified mise and locked tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.25
          sha256: 5d362ecc578dc7c146679b841dda949d6472cbf86ff5635db7afdca1b6b3fd87
          install_args: --locked
          cache: false
          env: false
      - name: Print selected tool versions
        run: mise run toolchain
      - name: Confirm installation did not change configuration
        run: git diff --exit-code -- mise.toml mise.lock

  # ADR-0010 M-01 and M-02. The job above binds the job; these two files bind the
  # repository, and a declaration that is not tested is a hypothesis (AGENTS.md 7).
  #
  # Every step here handles its own status through `if`, never through a shell fallback:
  # tests/test_ci_gates_are_real.py::test_no_run_step_swallows_its_exit_status forbids
  # the swallow token outright, and it caught this job on its first run. Each negative
  # leg is paired with a positive one, because a guard that only asserts absence also
  # passes when the command printed nothing at all.
  mise-config-scope:
    name: mise config scope guard (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verified mise and locked tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.25
          sha256: 5d362ecc578dc7c146679b841dda949d6472cbf86ff5635db7afdca1b6b3fd87
          install_args: --locked
          cache: false
          env: false
      - name: Show what mise loaded and what it trusts
        run: |
          set -euo pipefail
          mise --version
          echo "--- mise trust --show ---"
          if ! mise trust --show; then
            echo "note: trust listing exited non-zero"
          fi
          echo "--- mise config ---"
          if ! mise config; then
            echo "note: config listing exited non-zero"
          fi
      - name: Plant a decoy config one directory above the repository
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          printf '[tools]\nbidi-decoy = "9.9.9"\n' > "$parent/mise.toml"
          echo "planted: $parent/mise.toml"
          ls -l "$parent"
      - name: Leg 1 - unbounded search MUST see the decoy (so leg 2 is not vacuous)
        env:
          MISE_CEILING_PATHS: ""
        run: |
          set -euo pipefail
          if ! out="$(mise config 2>&1)"; then
            printf '%s\n' "$out"
            echo "::error::mise config could not be read; the guard refuses to grade an input it cannot see"
            exit 1
          fi
          printf '%s\n' "$out"
          if ! printf '%s' "$out" | grep -q 'bidi-decoy'; then
            echo "::error::the decoy is invisible even with no ceiling, so this runner cannot prove anything about ceiling_paths"
            exit 1
          fi
          echo "OK: with no ceiling mise discovers the parent config, matched on the decoy's own tool name."
      - name: Leg 2 - the repository .miserc.toml MUST hide the decoy and keep its own pins
        run: |
          set -euo pipefail
          if ! out="$(mise config 2>&1)"; then
            printf '%s\n' "$out"
            echo "::error::mise config could not be read"
            exit 1
          fi
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q 'bidi-decoy'; then
            echo "::error::ceiling_paths failed open: mise still loads a config above the repository"
            exit 1
          fi
          if ! vers="$(mise ls --current 2>&1)"; then
            printf '%s\n' "$vers"
            echo "::error::mise ls --current could not be read"
            exit 1
          fi
          printf '%s\n' "$vers"
          if ! printf '%s' "$vers" | grep -q '3\.12\.16'; then
            echo "::error::python 3.12.16 is not selected, so the repository config is not in effect and a silent refusal is being read as safety"
            exit 1
          fi
          if ! printf '%s' "$vers" | grep -q '1\.16\.1'; then
            echo "::error::terraform 1.16.1 is not selected, so the repository config is not in effect"
            exit 1
          fi
          echo "OK: decoy excluded, and both repository pins are the ones actually selected."
      - name: Leg 3 - plain "mise install" succeeds from the committed lockfile
        run: |
          set -euo pipefail
          mise install
          echo "OK: no --locked flag was passed anywhere and the lock still governed resolution. Leg 4 is meaningful."
      - name: Leg 4 - a version absent from the lockfile MUST be refused without --locked
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp mise.toml mise.lock .miserc.toml "$work"/
          cd "$work"
          sed -i 's/^python = "3\.12\.16"/python = "3.12.15"/' mise.toml
          if ! grep -q '3\.12\.15' mise.toml; then
            echo "::error::the fixture was not modified, so this leg would prove nothing"
            exit 1
          fi
          if ! mise trust .; then
            echo "note: mise trust exited non-zero on the scratch copy"
          fi
          data="$(mktemp -d)"
          if out="$(MISE_DATA_DIR="$data" mise install python 2>&1)"; then
            printf '%s\n' "$out"
            echo "::error::plain mise install ACCEPTED python 3.12.15, which is not in mise.lock - locked mode is not a property of the repository"
            exit 1
          fi
          printf '%s\n' "$out"
          if ! printf '%s' "$out" | grep -qi 'lock'; then
            echo "::error::install failed, but the refusal does not name the lockfile, so the cause is unrelated and this leg proves nothing"
            exit 1
          fi
          echo "OK: refused, and the refusal names the lockfile."
