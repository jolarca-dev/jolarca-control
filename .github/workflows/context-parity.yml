# context-parity.yml -- required status checks must be checks a repo can actually report.
#
# jolarca-control -- marketplace (jolarca-dev) governance control plane.
# SOC 2 CC6.6/CC8.1 · ISO 27001 A.5.3/A.8.32 · PCI-DSS 1.2.1
#
# Why this exists (D-44): repos/jolarca-identity.yml declared required contexts
# [ci, security, lint] while that repo's workflows published `shellcheck` and
# `gitleaks (full history)`. Under strict:true that is an unsatisfiable gate -- every
# future PR there would block forever once applied. The computation already existed in
# scripts/repo_readiness_audit.py but no workflow invoked it, so the defect was only
# ever found by hand. A detection no pipeline runs is folklore, not a control (D-22).
#
# Scope is deliberately narrow: the full readiness audit currently reports 15 of 16
# repos BLOCKED for unrelated reasons, so gating CI on it would be red every week and
# train dismissal. Exit codes are the fleet's three-valued contract -- 0 clean,
# 1 findings, 2 could-not-verify -- and 2 never reads as a pass (D-23).

name: Context Parity

on:
  pull_request:
    paths:
      - "repos/**"
      - "scripts/check_declared_contexts.py"
      - ".github/workflows/context-parity.yml"
  push:
    branches: [main]
    paths:
      - "repos/**"
      - "scripts/check_declared_contexts.py"
  schedule:
    # Weekly sweep: catches a declaration drifting away from a repo's workflows
    # between PRs, and re-checks every repo even when nothing changed here.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-parity:
    name: Context Parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      # Every allow-listed repo is public (verified 2026-10-04), so the job's own
      # GITHUB_TOKEN can read their workflow files; no admin-scoped PAT is required,
      # and no repo is queried beyond the allow-list.
      - name: Check declared status-check contexts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # EXEMPTIONS RETIRED 2026-10-15 — this list was emptying itself backwards.
          # It carried "jolarca-identity jolarca-security" until 2026-11-15 while the
          # pending Terraform plan contained `+ required_status_checks` for identity with
          # contexts (ci/security/lint) that its only workflow has never reported
          # ("gitleaks (full history)", "shellcheck"). Exempting the repo from the check
          # that detects an unsatisfiable declaration does not defer the defect: the plan
          # still carried it, and an apply would still have frozen every merge there.
          # identity's declaration is now the two real job names (repos/jolarca-identity.yml);
          # security was measured satisfiable (markdown-lint, policy-tests, secret-scan,
          # yaml-lint are all reported) so its entry was already stale. A new entry here
          # needs a dated record in policy/compliance-gates.yml, not just a string here.
          ALLOW_MISSING_REPOS: ""
          ALLOW_MISSING_UNTIL: ""
        run: python3 scripts/check_declared_contexts.py
