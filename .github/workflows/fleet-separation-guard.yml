# fleet-separation-guard.yml — ADR-0004 fleet integrity check.
#
# jolarca-control — marketplace (jolarca-dev) governance control plane.
# SOC 2 CC6.6 · ISO 27001 A.5.3/A.5.9 · PCI-DSS 1.2.1
#
# Verifies the org's jolarca* repo set matches the repos/*.yml allow-list.
# Path-filtered: only runs when repos/*.yml or the guard script change.
#
# ─────────────────────────────────────────────────────────────────────────────

name: Fleet Separation Guard

on:
  pull_request:
    paths:
      - "repos/**"
      - "scripts/check_fleet_separation.sh"
      - ".github/workflows/fleet-separation-guard.yml"
  push:
    branches: [main]
    paths:
      - "repos/**"
      - "scripts/check_fleet_separation.sh"
  schedule:
    # Weekly sweep: catches out-of-band repo creation between PRs.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  fleet-separation:
    name: Fleet Separation (ADR-0004)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
      - name: Run fleet separation guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_MISSING: "jolarca-compliance jolarca-data jolarca-infrastructure jolarca-legal jolarca-observability jolarca-security"
          ALLOW_MISSING_UNTIL: "2026-12-31"
        run: bash scripts/check_fleet_separation.sh
