# evidence-integrity.yml — weekly evidence hash verification.
#
# jolarca-control — marketplace (jolarca-dev) governance control plane.
# SOC 2 CC4.1 / ISO 27001 A.5.31 / PCI-DSS 12.10.1
#
# Runs scripts/hash_evidence.sh --check weekly to verify that no evidence
# file has changed since registration. A mismatch means an evidence file
# was modified without re-registration, which is an audit finding.
#
# Also runs on PRs that touch evidence directories.

name: Evidence Integrity

on:
  schedule:
    # Weekly: Monday 06:00 UTC
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "docs/adr/**"
      - "audit/**"
      - "policy/**"
      - "repos/**"
      - "docs/runbooks/**"
      - "docs/security/**"
      - "docs/evidence-registry.csv"
      - "scripts/hash_evidence.sh"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  evidence-check:
    name: Evidence Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.3.0
      - name: Register evidence (first run creates the registry)
        run: bash scripts/hash_evidence.sh
      - name: Verify evidence hashes
        run: bash scripts/hash_evidence.sh --check
