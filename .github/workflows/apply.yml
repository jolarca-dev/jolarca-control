name: "Terraform Apply"

# ──────────────────────────────────────────────────────────────────────────────
# Single-stage production apply. NOT an approval gate: as of 2026-10-16 the `production`
# environment carries a 30-minute deployment wait with admin bypass disabled (D-70), which is
# mechanical delay plus a cancel window, not a person signing anything. The header of this file
# used to claim "a manual approval gate" while the environment had no rules at all (D-58); the
# wording now matches the measured API object, and scripts/check_deploy_gates.py -- run inside the
# required Validate Repo Allow-List job -- fails if the environment ever goes back to empty.
#
# This deliberately does NOT replicate jol-control's dev → staging → prod
# promotion. A GitHub-organization control plane has exactly ONE target: the
# jolarca-dev org. There is no dev or staging org to promote through, so
# running the same plan three times would apply identical changes to the same
# real repositories three times. One gated apply is the correct shape.
#
# Auth: the default GITHUB_TOKEN cannot manage org-level resources or
# repositories other than the one it runs in. This workflow requires a
# fine-grained PAT stored as the `TF_GITHUB_TOKEN` secret, scoped to
# 'Administration: read/write' + 'Contents: read' on jolarca-dev.
# Rotation: docs/runbooks/github-token-rotation.md
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "repos/**"
      - "policy/**"
      - "*.tf"
      - "*.tfvars"
      - ".github/workflows/apply.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Never run two applies concurrently — concurrent writers to org state is how
# repositories get destroyed. cancel-in-progress: false makes the second run
# QUEUE, not cancel.
concurrency:
  group: "terraform-apply-jolarca-dev"
  cancel-in-progress: false

env:
  TF_INPUT: "0"

jobs:
  prod-apply:
    name: "Production — Apply"
    runs-on: ubuntu-latest
    # Backstop for the 2026-10-12 incident: a remote-execution plan sat in the
    # HCP worker queue for 33 minutes with `terraform apply -auto-approve`
    # waiting behind it. The execution-mode gate below refuses that shape up
    # front; this bounds the damage if the queue degrades for another reason.
    timeout-minutes: 20
    environment:
      name: production
      url: https://github.com/orgs/jolarca-dev/repositories

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── HARD GATE ──────────────────────────────────────────────────────────
      # Refuses to touch the live org until the state migration is complete and
      # verified. Without migrated state this root would try to CREATE
      # repositories that already exist while jolarca-infrastructure still owns
      # them — dual ownership of PCI-DSS-scoped production repos.
      - name: Assert state migration complete
        if: vars.STATE_MIGRATION_COMPLETE != 'true'
        run: |
          echo "::error::Refusing to apply: STATE_MIGRATION_COMPLETE is not 'true'."
          echo "This control plane does not yet own the github_* state."
          echo "Complete docs/state-migration-runbook.md first."
          exit 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          cli_config_credentials_token: ${{ secrets.TFC_TOKEN }}
          terraform_wrapper: false

      - name: Validate allow-list (repos/*.yml)
        run: |
          pip install -r requirements.txt
          python3 scripts/validate_repos.py

      - name: Fleet separation guard (ADR-0004)
        run: bash scripts/check_fleet_separation.sh
        env:
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN_READONLY }}

      # ── Execution-mode gate ────────────────────────────────────────────────
      # A `cloud {}` workspace in REMOTE execution mode sends `terraform plan`
      # to HashiCorp's workers instead of running it on this runner. On the Free
      # plan that queue is unbounded from here: run 38239257880 hung 33 minutes
      # on 2026-10-12 while an auto-approved apply waited behind it.
      #
      # Two earlier "fixes" for this were no-ops and are recorded so they are
      # not re-added: `terraform plan -local` is not a flag in Terraform 1.16.1
      # (measured against `terraform plan -help`), and `TF_CLOUD_OPERATIONS`
      # is not a documented Terraform environment variable — both were in this
      # file while runs kept landing on remote workers. The real lever is the
      # workspace setting `execution-mode: local`, which this step asserts.
      #
      # The JSON:API media type is required on HCP Terraform POST/PATCH calls;
      # a missing Content-Type is refused with HTTP 415 (measured 2026-10-12).
      - name: Assert workspace execution mode is local
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
        run: |
          set -eu
          curl -sS -m 30 \
            -H "Authorization: Bearer $TFC_TOKEN" \
            -H "Content-Type: application/vnd.api+json" \
            https://app.terraform.io/api/v2/organizations/jolarca-dev/workspaces/jolarca-control \
            > workspace.json
          bash scripts/check_workspace_execution_mode.sh workspace.json local

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}

      # ── Plan review gate ───────────────────────────────────────────────────
      # A destroy or a visibility change is never auto-approved. `prevent_destroy`
      # already blocks repo destruction at the Terraform level; this catches
      # visibility flips (see docs/drift-findings.md D-01) and anything else
      # unexpected so a human reads the plan before it lands.
      #
      # The patterns live in scripts/check_plan_safety.sh, NOT inline here, so
      # they are covered by tests/test_check_plan_safety.sh. The previous inline
      # version matched `visibility\s*:` while `terraform show` emits
      # `visibility = `, so the gate silently never fired (D-22).
      - name: Refuse destructive or visibility-changing plans
        run: |
          terraform show -no-color tfplan > plan.txt
          bash scripts/check_plan_safety.sh plan.txt

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}

      - name: Post-apply compliance snapshot
        run: |
          pip install -r requirements.txt
          python3 scripts/compliance_check.py --output compliance-snapshot.json
          echo "Compliance snapshot generated."

      # Post-apply verification. If this step fails, the apply has ALREADY
      # happened — a red job here means "applied but not verified", which is
      # the honest signal. drift_detect.py exits 2 when it cannot read live
      # state; that is a failure, not a pass (D-23). TF_GITHUB_TOKEN_READONLY
      # has no GITHUB_TOKEN fallback on purpose: the default token cannot read
      # org-wide metadata, so falling back would only produce exit 2 anyway.
      - name: Post-apply drift detection
        run: python3 scripts/drift_detect.py
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN_READONLY }}

      - name: Upload compliance snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-snapshot-${{ github.sha }}
          path: compliance-snapshot.json
          retention-days: 90
