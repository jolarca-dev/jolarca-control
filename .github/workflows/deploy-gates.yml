# deploy-gates.yml -- a job that names an `environment:` must face a human who cannot skip it.
#
# jolarca-control -- marketplace (jolarca-dev) governance control plane.
# SOC 2 CC6.6/CC8.1 · ISO 27001 A.5.3/A.8.32 · PCI-DSS 1.2.1
#
# Why this exists (D-52): apply.yml's own header claims "a manual approval gate", and it points at
# `environment: production`. Measured 2026-10-05 that environment has protection_rules: [] and
# can_admins_bypass: true, so nothing between a merge touching repos/** and
# `terraform apply -auto-approve` against the whole organisation is a person -- the only stop is the
# unset STATE_MIGRATION_COMPLETE variable, and merging #32 already fired that workflow within seconds of
# the merge. GitHub creates a referenced environment empty on first use, so the absence of rules is
# structural, not a decision anyone made. A control no pipeline verifies is folklore (D-22).
#
# The job is supplementary, not a required context: this repo's declared required checks are the three
# from compliance-scan.yml, and adding a fourth before its finding is remediated would block merges on a
# red that today has no fix in hand. Exit codes are the fleet's three-valued contract -- 0 clean,
# 1 findings, 2 could-not-verify -- and a 2 fails the job rather than reading as a pass (D-23).

name: Deploy Gates

on:
  pull_request:
    paths:
      - ".github/workflows/apply.yml"
      - ".github/workflows/deploy-gates.yml"
      - "scripts/check_deploy_gates.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply.yml"
      - ".github/workflows/deploy-gates.yml"
      - "scripts/check_deploy_gates.py"
  schedule:
    # The setting that matters lives in repository configuration, not in this tree: an environment can be
    # stripped of its reviewers from the UI with no commit anywhere. The weekly sweep is what notices.
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy-gates:
    name: Deploy Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      # Time-boxed rather than silenced, same shape as context-parity.yml. The exemption exists only
      # because the fix is a settings change the operator has to make in the UI, not a commit: on
      # Settings -> Environments -> production add required reviewers (self, since this organisation is a
      # single member), enable prevent self-review, and turn off "Allow administrators to bypass
      # configured protection rules". Free-plan availability is not the obstacle -- GitHub documents
      # environments and protection rules as available for public repositories on all current plans, and
      # this repository is public. Delete this exemption the moment the rules exist; if the date passes
      # with it still listed, the job goes red on purpose, because an exception without an expiry is how
      # a known gap becomes a permanent one.
      - name: Check deployment environment gates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_UNPROTECTED_ENVS: "jolarca-dev/jolarca-control:production"
          ALLOW_UNPROTECTED_UNTIL: "2026-10-19"
          # Widening to the other two repos that deploy via environments (jolarca,
          # jolarca-infrastructure) is a separate decision, recorded in D-52: three of their four
          # environments are equally unprotected and belong to the mission-side workstream, so gating this
          # repo's CI on them would be red for someone else's settings.
        run: python3 scripts/check_deploy_gates.py
