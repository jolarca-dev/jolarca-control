# deploy-gates.yml -- a job that names an `environment:` must face a human who cannot skip it.
#
# jolarca-control -- marketplace (jolarca-dev) governance control plane.
# SOC 2 CC6.6/CC8.1 · ISO 27001 A.5.3/A.8.32 · PCI-DSS 1.2.1
#
# Why this exists (D-58): apply.yml's own header claimed "a manual approval gate", and it points at
# `environment: production`. Measured 2026-10-05 that environment had protection_rules: [] and
# can_admins_bypass: true, so nothing between a merge touching repos/** and
# `terraform apply -auto-approve` against the whole organisation was a person. GitHub creates a
# referenced environment empty on first use, so the absence of rules was structural, not a decision
# anyone made. A control no pipeline verifies is folklore (D-22).
#
# Status since 2026-10-16: the environment is no longer empty. D-70 set wait_timer=30 with
# can_admins_bypass=false (verified by GET re-read, and the cancel window proved usable on run
# 38813823199). This gate still reports that as a FINDING, correctly: a wait is not an approval, and
# the row it enforces says so. The allowance below is therefore a dated acceptance of delay-without-
# approval, recorded in policy/compliance-gates.yml `exceptions.active` -- an exemption living only in
# a workflow string is how a known gap quietly becomes permanent.
#
# Wiring: the same script now also runs as a step inside the REQUIRED `Validate Repo Allow-List`
# job (compliance-scan.yml), because an advisory check that reports the truth cannot stop anything
# -- that is D-67's lesson, learned the hard way on a different gate. This workflow stays as the
# path-filtered and scheduled early signal, so a regression is visible before a merge is attempted.
# Exit codes are the fleet's three-valued contract -- 0 clean, 1 findings, 2 could-not-verify -- and
# a 2 fails the job rather than reading as a pass (D-23).

name: Deploy Gates

on:
  pull_request:
    paths:
      - ".github/workflows/apply.yml"
      - ".github/workflows/deploy-gates.yml"
      - "scripts/check_deploy_gates.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply.yml"
      - ".github/workflows/deploy-gates.yml"
      - "scripts/check_deploy_gates.py"
  schedule:
    # The setting that matters lives in repository configuration, not in this tree: an environment can be
    # stripped of its reviewers from the UI with no commit anywhere. The weekly sweep is what notices.
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy-gates:
    name: Deploy Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      # The setting that matters lives in repository configuration, not in this tree, so this
      # job re-reads it weekly. Status 2026-10-17: `production` now carries BOTH rules —
      # `wait_timer: 30` (D-70) and `required_reviewers` with `prevent_self_review: false` —
      # confirmed by cache-busted GET re-read, not by the write's status code. The exemption
      # that accepted 'wait but no approver' is deleted; restoring one needs a dated reason.
      # Stated honestly: with one org member self-approval is permitted, so this is an intent
      # checkpoint that leaves a record, NOT separation of duties — PCI-DSS 6.5.1 and SOC 2
      # CC8.1 dual control remain unsatisfied (D-58 open).
      # API traps measured while adding it: the PUT body wants a FLAT reviewer object
      # `{"type":"User","id":n}` while the GET returns a NESTED `reviewer:{login,id}`; the
      # nested write shape fails 422 `Required reviewers must have at least one reviewer`,
      # which reads like 'no reviewers exist' but means 'your array was dropped'. The GET's
      # top-level `reviewers` stays `null` even when live — the truth is
      # `protection_rules[].reviewers`. `updated_at` did not move after a successful write, so
      # it is not evidence of change. Each of the five rejected bodies was confirmed harmless
      # by re-read before the next was tried.
      - name: Check deployment environment gates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Widening to the other two repos that deploy via environments (jolarca,
          # jolarca-infrastructure) is a separate decision, recorded in D-58: three of their four
          # environments are equally unprotected and belong to the mission-side workstream, so gating this
          # repo's CI on them would be red for someone else's settings.
        run: python3 scripts/check_deploy_gates.py
