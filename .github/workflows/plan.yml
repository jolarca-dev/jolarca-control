# plan.yml — Terraform plan with safety gate.
#
# jolarca-control — marketplace (jolarca-dev) governance control plane.
# SOC 2 CC8.1 · ISO 27001 A.8.32 · PCI-DSS 6.5.1
#
# Runs `terraform plan` on every PR and checks the output with
# scripts/check_plan_safety.sh. Refuses any plan that destroys, replaces,
# or changes repository visibility (the D-01/D-22 lesson).
#
# ── STATE MIGRATION GATE ─────────────────────────────────────────────────────
# Until the state migration in docs/state-migration-runbook.md completes,
# this root has no state and the github_* resources are still owned by
# jolarca-infrastructure. A live plan would refresh against the real org
# and, worse, imply this root is authoritative. Flip the repo variable
# STATE_MIGRATION_COMPLETE to 'true' only after runbook step 7 verifies.
# ─────────────────────────────────────────────────────────────────────────────
# Path-filtered: only runs when HCL or repo definitions change.

name: Plan

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "repos/**"
      - "policy/**"
      - ".terraform.lock.hcl"
      - ".github/workflows/plan.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "repos/**"
      - "policy/**"
      - ".terraform.lock.hcl"

permissions:
  contents: read
  pull-requests: write

env:
  TF_INPUT: "0"

jobs:
  validate:
    name: Validate & Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          cli_config_credentials_token: ${{ secrets.TFC_TOKEN }}

      - name: Validate allow-list (repos/*.yml)
        run: |
          pip install -r requirements.txt
          python3 scripts/validate_repos.py

      - name: Terraform fmt -check
        run: terraform fmt -check -recursive

      # ── Backend MUST be initialised ───────────────────────────────────────
      # This step used to run `terraform init -backend=false`. With the `cloud {}`
      # block in main.tf that leaves the backend uninitialised, so the gated plan
      # step below could never succeed — and it never did. Measured on run
      # 38062308506 (2026-10-10T15:07Z, fix/close-d33-branch-protection): step 9
      # was `skipped` and step 10 `Record skipped plan` succeeded, i.e. every
      # historical green "Validate & Plan" predates STATE_MIGRATION_COMPLETE=true
      # and reports assurance it did not earn. The first PR to run the step for
      # real (#67, 2026-10-12) failed in 11 seconds. Same class as D-22 and D-50.
      # The cloud-backend token comes from cli_config_credentials_token above.
      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      # ── Live plan is GATED ─────────────────────────────────────────────────
      # `shell: bash {0}` is deliberate: the default runner shell is `bash -e`,
      # which aborts on `-detailed-exitcode`'s exit 2 ("succeeded, there is a
      # diff") before the exit code can be recorded. That would turn every
      # legitimate .tf change into a red gate — denial-of-pipeline, the L-19
      # lesson — and would hide the plan text the PR comment exists to show.
      # Genuine errors still fail, via "Fail on plan error" at the end.
      # GITHUB_TOKEN is deliberately NOT used here: the default workflow token is
      # scoped to jolarca-control alone, and a plan that refreshes the other 15
      # repositories' branch protection and settings would fail on it. The plan
      # needs the same read-capable credential apply.yml uses (D-56).
      - name: Terraform Plan (gated on STATE_MIGRATION_COMPLETE)
        id: plan
        if: vars.STATE_MIGRATION_COMPLETE == 'true'
        shell: bash {0}
        run: |
          set -o pipefail
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            2>&1 | tee plan-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}

      - name: Record skipped plan
        if: vars.STATE_MIGRATION_COMPLETE != 'true'
        run: |
          cat > plan-output.txt <<'MSG'
          terraform plan SKIPPED — STATE_MIGRATION_COMPLETE is not 'true'.

          This control plane is not yet authoritative. The github_* resources it
          declares are still owned by the live Terraform state in
          jolarca-infrastructure (module.github_org.*). Running a live plan or
          apply from here before the state migration completes risks dual
          ownership of PCI-DSS-scoped repositories.

          See docs/state-migration-runbook.md.
          Validate + fmt + init + validate-only checks above DID run and passed.
          MSG

      - name: Plan safety check
        run: bash scripts/check_plan_safety.sh plan-output.txt

      - name: Comment plan on PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terraform-plan
          recreate: true
          path: plan-output.txt

      - name: Fail on plan error
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1
