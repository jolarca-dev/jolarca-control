# plan.yml — Terraform plan with safety gate.
#
# jolarca-control — marketplace (jolarca-dev) governance control plane.
# SOC 2 CC8.1 · ISO 27001 A.8.32 · PCI-DSS 6.5.1
#
# Runs `terraform plan` on every PR and checks the output with
# scripts/check_plan_safety.sh. Refuses any plan that destroys, replaces,
# or changes repository visibility (the D-01/D-22 lesson).
#
# ── STATE MIGRATION GATE ─────────────────────────────────────────────────────
# Until the state migration in docs/state-migration-runbook.md completes,
# this root has no state and the github_* resources are still owned by
# jolarca-infrastructure. A live plan would refresh against the real org
# and, worse, imply this root is authoritative. Flip the repo variable
# STATE_MIGRATION_COMPLETE to 'true' only after runbook step 7 verifies.
# ─────────────────────────────────────────────────────────────────────────────
# Path-filtered: only runs when HCL or repo definitions change.

name: Plan

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "repos/**"
      - "policy/**"
      - ".terraform.lock.hcl"
      - ".github/workflows/plan.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "repos/**"
      - "policy/**"
      - ".terraform.lock.hcl"

permissions:
  contents: read
  pull-requests: write

env:
  TF_INPUT: "0"

jobs:
  validate:
    name: Validate & Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          cli_config_credentials_token: ${{ secrets.TFC_TOKEN }}

      - name: Validate allow-list (repos/*.yml)
        run: |
          pip install -r requirements.txt
          python3 scripts/validate_repos.py

      - name: Terraform fmt -check
        run: terraform fmt -check -recursive

      # ── D-56 root cause, reproduced 2026-10-15 ─────────────────────────────
      # This step used to read `terraform init -input=false -backend=false`.
      # On a clean runner checkout that leaves the `cloud {}` block
      # uninitialised, and the next `terraform plan` then aborts with
      #   Error: HCP Terraform or Terraform Enterprise initialization required:
      #   please run "terraform init" — Changes to the HCP Terraform
      #   configuration block require reinitialization
      # which is exactly the red "Validate & Plan" every PR has carried since
      # 2026-10-12. Reproduced and retired locally: with `-backend=false` on a
      # tree containing only the .tf files + repos/, plan fails with that error;
      # with a normal init (matching apply.yml line ~125), the same tree plans
      # successfully. `terraform validate` does not need the backend skipped.
      #
      # Consequence, stated rather than hidden: the plan is now readable, so the
      # refusal a human was supposed to see comes from "Plan safety check"
      # below, which since D-61 also refuses protection-layer creates/changes
      # and security-feature disables. Until docs/state-migration-runbook.md
      # step 6 is reconciled, that step will fail on every PR whose plan is not
      # a no-op. That is the intended signal, not a malfunction — do not weaken
      # the gate to make it green (AGENTS.md §5).
      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      # ── Live plan is GATED ─────────────────────────────────────────────────
      #
      # `shell: bash {0}` is load-bearing, added 2026-10-19. The Actions default for
      # a `run:` step is `bash -e {0}` (visible in the log of every step above), and
      # `-detailed-exitcode` exits **2** when a plan has changes. Under `-e` the step
      # therefore aborted at the pipeline, which meant:
      #   * `echo "exit_code=..."` never ran, so `steps.plan.outputs.exit_code` was
      #     always empty and the "Fail on plan error" step at the bottom could never
      #     fire — a gate that is unreachable is not a gate (AGENTS.md §7);
      #   * "Plan safety check" was skipped, so the refusal gate never read the plan on
      #     exactly the input it exists for: a plan that actually changes something.
      # apply.yml never had this bug because it plans without `-detailed-exitcode`
      # (line ~133), so exit 0 on a diff. Measured on run 39062414977 (rerun
      # 2026-10-19T11:58Z): steps after Init reported `skipped`, job red from Init.
      # With `-e` off, exit 2 is a normal outcome that the safety gate judges, exit 1
      # is routed to "Fail on plan error", and exit 0 passes through.
      - name: Terraform Plan (gated on STATE_MIGRATION_COMPLETE)
        id: plan
        if: vars.STATE_MIGRATION_COMPLETE == 'true'
        shell: bash {0}
        run: |
          set -o pipefail
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            2>&1 | tee plan-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          # Measured 2026-10-17, run 39061106590: with the runner default token this step
          # failed on all fifteen sibling repositories --
          #   GET /repos/jolarca-dev/<repo>/vulnerability-alerts: 403 Resource not
          #   accessible by integration
          # because `secrets.GITHUB_TOKEN` is scoped to jolarca-control alone. The same
          # defect was fixed in apply.yml for the sibling reason (see D-56). A plan is a
          # read, so the credential is the read-only PAT, not the write token: this job
          # must never be able to mutate the organisation. Proven org-wide the same day by
          # the `Fleet separation guard (ADR-0004)` step, which runs gh against the fleet
          # with this very secret and passed.
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN_READONLY }}

      - name: Record skipped plan
        if: vars.STATE_MIGRATION_COMPLETE != 'true'
        run: |
          cat > plan-output.txt <<'MSG'
          terraform plan SKIPPED — STATE_MIGRATION_COMPLETE is not 'true'.

          The variable is the operator's switch on this workflow, nothing more.
          State itself already lives in the HCP Terraform workspace
          jolarca-dev/jolarca-control (see docs/state-migration-runbook.md,
          status COMPLETE 2026-10-10) and the legacy jolarca-infrastructure root
          was drained of github_* resources by `terraform state rm` (D-13), so
          this control plane IS the sole declarative owner. Reading an earlier
          draft of this message as "the resources still belong to
          jolarca-infrastructure" would be wrong: that claim predates the
          migration and was corrected here on 2026-10-15.

          No plan was produced, so no apply may proceed from this run.
          Validate + fmt + init-only checks above DID run and passed.
          MSG

      # Consequence of the guard above, stated rather than hidden: when
      # STATE_MIGRATION_COMPLETE is flipped back to 'false', the stub written by
      # "Record skipped plan" is prose, so "Plan safety check" now exits 2 and this
      # required context goes RED instead of reporting green on a plan that never
      # ran. That is the intended reading (AGENTS.md §3: could-not-verify is never
      # a pass; and the 2026-10-10 lesson that a green plan gate planned nothing).
      - name: Plan safety check
        run: bash scripts/check_plan_safety.sh plan-output.txt

      # Measured 2026-10-19, run 39062414977: `Terraform Init` failed, so
      # plan-output.txt was never written, and this step died with
      #   Either message or path input is required
      # — a second red step whose text points at the sticky-comment action rather
      # than at the credential that actually broke. `always()` alone is not enough:
      # the action needs the file to exist. Existence is checked with `[ -s ]` in a
      # preceding step rather than `hashFiles()`, because plan-output.txt is listed
      # in .gitignore (line 68) and hashFiles skips ignored paths.
      - name: Detect plan output
        id: planout
        if: always()
        run: |
          if [ -s plan-output.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment plan on PR
        if: always() && steps.planout.outputs.present == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terraform-plan
          recreate: true
          path: plan-output.txt

      # Reachable for the first time with `shell: bash {0}` above: this used to test
      # an output that could never be set, so a plan that errored (exit 1) was only
      # ever signalled by the aborting step, never by this named assertion.
      - name: Fail on plan error
        if: steps.plan.outputs.exit_code == '1'
        run: |
          echo "::error::terraform plan exited 1 (see the 'Terraform Plan' step body). A plan that failed to compute is not a plan that was reviewed."
          exit 1
