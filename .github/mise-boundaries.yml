# ──────────────────────────────────────────────────────────────────────
# mise-en-place boundary declaration — jolarca-control
# ──────────────────────────────────────────────────────────────────────
# Normative, machine-readable statement of who owns each mise configuration layer.
# The prose version is docs/adr/0010-per-repository-toolchain-configuration.md; this
# file exists so the boundary can be *checked* rather than remembered. It landed
# 2026-11-04, four days after the ADR, because the propagate round described it as an
# artifact while it existed only in a temporary directory that no longer exists. Every
# claim in this file is traceable to a measurement recorded in the ADR.
#
# Deliberately NOT in policy/: policy/** is one of apply.yml's own on.push.paths, so a
# purely declarative file placed there arms a real `terraform apply -auto-approve` on
# merge. It also is not hashed into docs/evidence-registry.csv, so it can change
# without re-registration; the governing prose is in docs/adr/ and stays attested there.

schema_version: 1
repository: jolarca-control
declared_on: "2026-11-04"
governed_by: docs/adr/0010-per-repository-toolchain-configuration.md

# Which layer each mise file is the authority for. A layer with exactly one owner file
# cannot be silently configured in two places, which is the failure mode the ADR's
# Context section documents: mise merges [tools] per tool across every config it
# discovers, so two files can both be active and neither looks responsible.
layers:
  executable:
    owner: platform
    owned_by_this_repo: false
    note: >-
      The mise binary itself. One approved version plus digest per workstation and
      runner image. No repository file can enforce it, and settings.paranoid is
      read only from global/user config — a project cannot enable it, so the bound
      on the tool's own version is not ours to declare here.

  catalogue:
    owner: jolarca-control
    path: docs/security/toolchain-catalogue.yml
    note: >-
      The approved tool set, exact releases, upstream verification recipes, expiry
      dates and exceptions. Central: a per-repository copy would be sixteen
      independent approvals of the same decision, which is the divergence finding
      this catalogue exists to detect.

  bounds:
    owner: per-repository
    files:
      - path: .miserc.toml
        owns: ceiling_paths
        why_here: >-
          mise reads .miserc.toml BEFORE any mise.toml, so ceiling_paths placed under
          [settings] in mise.toml has no effect on config discovery. Measured.
        critical_detail: >-
          The ceiling must name the PARENT of the repository root. A ceiling directory
          is not itself searched, so bounding at the repo root disables the repo's own
          mise.toml — a bound that "passes" by disabling the thing it guards.
        fails_open: true
        fails_open_reason: >-
          A .miserc.toml whose template does not render is used raw and silently, so
          the bound evaporates without an error. This is why the guard tests for the
          decoy's ABSENCE rather than trusting this file's presence.
      - path: mise.toml
        owns: "[tool_config] locked"
        why_here: >-
          Strict lockfile mode is not merged across configs and reaches only tools
          declared in the same config root, so it must ship in the repository file,
          not in a global one.
    never_owned_by_a_repo:
      - settings.paranoid
      - the mise binary version

  pin:
    owner: per-repository
    path: mise.toml
    section: "[tools]"
    note: >-
      The tool set is a product fact and the approved release is catalogued centrally;
      the two are reconciled by scripts/check_toolchain_baseline.py --live, not by
      copying the catalogue here.

  lock:
    owner: per-repository
    path: mise.lock
    note: >-
      Resolved per platform. A lock cannot be authored by hand and remain true, so it
      is generated by `mise lock` on the platform it declares. Recorded caveat: no
      lock in the fleet has ever been resolved by a verified mise — mise is still not
      installed on any workstation.

# What a repository may NOT do, expressed as the check that enforces it rather than as
# prose an agent can skip.
invariants:
  - id: B1
    statement: no mise.toml may appear above a repository root inside the workspace tree
    enforced_by: .github/workflows/mise-toolchain.yml (mise-config-scope, decoy legs)
    status: enforced-on-jolarca-control-only
  - id: B2
    statement: lockfile mode is a property of the repository, not of the job that invokes it
    enforced_by: mise.toml [tool_config] locked = true, plus the guard's lock-fallback leg
    status: enforced-on-jolarca-control-only
  - id: B3
    statement: the approved tool set is decided once, centrally
    enforced_by: docs/security/toolchain-catalogue.yml plus rules C1-C8 and L1-L7
    status: enforced-on-jolarca-control-only
  - id: B4
    statement: a version that is requested rather than declared must be visible
    enforced_by: rule R8 in scripts/check_toolchain_baseline.py
    status: enforced-on-jolarca-control-only

# Honest scope. Read this before citing the file as fleet policy.
scope_limits:
  default_branches_configured: 1
  default_branches_in_fleet: 17
  workstation_enforcement: none
  detail: >-
    No bound in this file reaches a developer workstation, because no bound reaches
    global or system config and mise is installed on no machine here. The fleet drift
    gate runs in advisory mode only: making it a required status check today would
    wedge every repository that reports 14 findings against it.
