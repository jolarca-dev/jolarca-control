# ──────────────────────────────────────────────────────────────────────────────
# GDPR — Article-by-Article Compliance Checklist
# ──────────────────────────────────────────────────────────────────────────────
# Mapped to jolarca-control enforcement points.
# Organization: jolarca-dev — marketplace scope, EU market (VAT OSS), 27 member
# states. Scope covers KYC/AML identity verification and payment data.
# Review cadence: Quarterly
# Last reviewed: 2026-09-25
#
# Status vocabulary is shared with audit/soc2-checklist.yml — read the header
# there.
#
# NOTE ON EVIDENCE: the authoritative DPIAs, RoPA/ERoPA entries and breach
# procedures live in `jolarca-compliance`, and the legal bases, DPAs and
# privacy notices live in `jolarca-legal`. This checklist records which control
# in THIS repository supports which article; it does not restate the
# processing records and must not be cited as the record of processing itself.
# ──────────────────────────────────────────────────────────────────────────────

framework: "GDPR"
version: "Regulation (EU) 2016/679"
owner: "jolarca-dev organization owner (single operator — D-10)"
verification_date: "2026-09-25"
dpo_contact: "see jolarca-legal — contact details are published there and in the org health repo SECURITY.md; deliberately not duplicated in this file"

articles:
  Art37:
    title: "Designation of a data protection officer"
    controls:
      - id: "Art37-01"
        description: "DPO appointment decision documented — or 'not required' assessed with reasoning"
        evidence: >
          GDPR Art. 37(1) requires a DPO when: (a) processing is carried out
          by a public authority, (b) core activities involve regular and
          systematic monitoring of data subjects on a large scale, or (c) core
          activities involve large-scale processing of special-category data.
          The jolarca marketplace collects KYC/AML identity documents (potentially
          Art. 9 special-category) and operates a consent registry that processes
          personal data systematically. The GDPR checklist header states
          'dpo_contact: see jolarca-legal' but no formal DPO decision document
          exists — neither an appointment letter nor a 'not required' assessment.
        enforcement: "manual; legal review"
        status: "gap"
        note: >
          Marketplace + KYC/AML scope makes 'DPO not required' a defensible-
          but-documented call. The assessment must consider: (1) whether KYC
          document processing is 'large-scale' (even a small marketplace
          processes identity documents systematically), (2) whether the consent
          registry's systematic tracking of consent state constitutes 'regular
          and systematic monitoring', (3) whether any KYC data engages Art. 9
          (e.g., biometric photos on identity documents). If any criterion is
          met, a DPO must be designated. The decision — whether to appoint or
          not — must be documented, reviewed annually, and the DPO's contact
          details published (Art. 37(7)).

  Art5:
    title: "Principles relating to processing of personal data"
    controls:
      - id: "Art5-01"
        description: "Lawfulness, purpose limitation and data minimisation documented per processing activity"
        evidence: "jolarca-legal (legal bases, privacy notices) and jolarca-compliance (RoPA/ERoPA)"
        enforcement: "manual review; repos are in the allow-list with tier=governance"
        status: "implemented"
        note: "Held in other repositories. This control plane's contribution is that both repos are declared, classified and protected."
      - id: "Art5-02"
        description: "Integrity and confidentiality (Art. 5(1)(f)) — repositories holding personal-data models are not publicly readable"
        evidence: "All repos now LIVE PUBLIC per GitHub forced migration (D-37). Declarations aligned. Data classifications downgraded confidential->internal for 5 repos."
        enforcement: "scripts/validate_repos.py classification/visibility coherence rule"
        status: "accepted"
        note: "D-01 resolved via forced migration (2026-10-01). Risk acceptance in compliance-gates.yml (fleet-public-2026-10). RoPA and vendor assessments are world-readable — assess under GDPR Art. 33 whether notifiable."
      - id: "Art5-03"
        description: "Retention schedule wired to consent records — consent justification outlives the data it justifies"
        evidence: >
          ADR-0003 references retention class RC-MARKETING-CONSENT in
          jolarca-compliance/retention/matrix.yaml, but the consent registry
          itself has no TTL enforcement. Anonymized records are retained
          'indefinitely' (ADR-0003). The retention period for non-marketing
          consent purposes is '[COUNSEL-TO-CONFIRM]'. No code enforces
          deletion or anonymization after the retention period expires.
        enforcement: "none active — retention is a policy document, not a technical control"
        status: "gap"
        note: >
          Consent records (justification) typically outlive the data they
          justify — this is correct by design (Art. 7(1) requires proving
          consent was given). But the retention schedule must define: (1) how
          long consent records are retained after the underlying processing
          ends, (2) when anonymized records are finally deleted or aggregated,
          (3) whether 'indefinitely' is defensible for each purpose class.
          The retention-as-code claim needs TTL enforcement in the consent
          registry: a scheduled job that anonymizes or deletes records past
          their retention date, with the event recorded in the hash chain.

  Art25:
    title: "Data protection by design and by default"
    controls:
      - id: "Art25-01"
        description: "Data classification required and enforced per repository"
        evidence: "repos/*.yml compliance.data_classification; docs/data-classification.md"
        enforcement: "scripts/validate_repos.py"
        status: "implemented"
      - id: "Art25-02"
        description: "No personal data or secrets in git"
        evidence: "policy/repo-defaults.yml data_handling.secrets_in_git = prohibited; required gitignore patterns; secret-pattern sweep in compliance-scan.yml"
        enforcement: "CI: secret_scan gate"
        status: "implemented"
        note: "jolarca-data is declared 'schemas and migrations, no production data in git'. That invariant is asserted by the repo's own policy, not technically enforced here — verify it during the quarterly review."
      - id: "Art25-03"
        description: "Wiki disabled on all repositories (prevents uncontrolled, unclassified storage)"
        evidence: "has_wiki = false verified live on all six repos, 2026-09-25"
        enforcement: "github_repository + validate_repos.py"
        status: "implemented"
      - id: "Art25-04"
        description: "Privacy-by-default repository settings (issues, projects, discussions minimised)"
        evidence: "has_issues = false and has_projects = false verified live on all five fleet repos; has_discussions = false declared"
        enforcement: "github_repository"
        status: "pending-adoption"
        finding: "D-09"

  Art7:
    title: "Conditions for consent"
    controls:
      - id: "Art7-01"
        description: "Consent UX reviewed: freely given, granular, no dark patterns, withdrawal ≤ 1 click"
        evidence: "jolarca-consent ConsentPurpose taxonomy (marketing, location, ai) enforces granularity at the API level; the UX itself lives in jolarca (product) and is NOT assessed here"
        enforcement: "none active — consent UX review is a product-side control, not a registry control"
        status: "gap"
        note: >
          A technically perfect consent chain fed by a coercive banner is still
          unlawful (Art. 4(11), 7(3)). The consent registry enforces append-only
          records and purpose granularity, but cannot verify that the UX that
          generates the records is compliant. The product's consent UX must be
          reviewed independently: (a) consent is freely given (not bundled with
          T&C acceptance), (b) each purpose has its own toggle (granularity),
          (c) withdrawal is no more than one click from any screen, (d) no dark
          patterns (pre-ticked boxes, consent-as-a-gate-to-service). This review
          belongs in jolarca-compliance or jolarca-legal, not in this control
          plane.

  Art12:
    title: "Transparent information, communication and modalities (Art. 12–17 rights)"
    controls:
      - id: "Art12-01"
        description: "DSAR pipeline: access, rectification, erasure within 30 days, automated"
        evidence: >
          jolarca-consent provides GET /api/v1/dsr/export/?subject_id=<uuid>
          (Art. 15/20 portability) and ADR-0003 anonymize-don't-delete (Art. 17
          erasure). However: (1) rectification (Art. 16) is not implemented —
          the append-only model cannot rectify, only annotate; (2) the DSAR
          pipeline is consent-only — it does not cover user data, payment data,
          or KYC documents held in jolarca, jolarca-data, or jolarca-payments;
          (3) no end-to-end DSAR runbook exists that coordinates across all
          processing systems within the 30-day deadline.
        enforcement: "none active — manual DSAR handling at marketplace scale will breach Art. 12(3) deadlines"
        status: "gap"
        note: >
          Manual DSAR handling at marketplace scale will breach the 30-day
          deadline (Art. 12(3)). The consent registry's DSR export endpoint is
          one component; the full pipeline must cover every system that holds
          personal data: user profiles (jolarca), payment tokens (jolarca-payments
          / Stripe), KYC documents (jolarca-data), location data, and AI feature
          data. Each system needs a documented DSAR response procedure, and a
          coordinator must aggregate responses within 30 days. This belongs in
          jolarca-compliance as a cross-service runbook.

  Art28:
    title: "Processor relationships"
    controls:
      - id: "Art28-01"
        description: "DPAs in place with sub-processors"
        evidence: "jolarca-legal repository (DPA templates and executed agreements)"
        enforcement: "manual; repo declared tier=governance"
        status: "implemented"
      - id: "Art28-02"
        description: "GitHub as processor covered by a DPA"
        evidence: "GitHub Data Protection Addendum; held in jolarca-legal"
        enforcement: "legal review"
        status: "implemented"
      - id: "Art28-03"
        description: "Consent-data subprocessor register: bare-metal hoster, GCP (GKE), PostgreSQL"
        evidence: >
          jolarca-consent docs/architecture.md states: Django service runs in
          GKE, PostgreSQL on bare metal, WireGuard mesh between them. But the
          org profile does not declare which specific providers host consent
          data, and "EU-only, no transfers without TIA" is a claim in
          policy/repo-defaults.yml, not a verified configuration. The consent
          registry holds personal data (subject_id UUID, IP address, user
          agent) and every infrastructure provider that touches it is a
          sub-processor under Art. 28.
        enforcement: "none active — residency is asserted in policy, not verified by configuration"
        status: "gap"
        note: >
          Where does consent data live — bare metal or GKE? The architecture
          says both (Django in GKE, PostgreSQL on bare metal). Each is a
          sub-processor. The subprocessor register in jolarca-compliance must
          enumerate: (1) the bare-metal hoster (Hetzner? per vendor
          assessments), (2) GCP for GKE workloads, (3) Stripe if any consent
          data flows to payment processing. Each needs a DPA and a Transfer
          Impact Assessment if outside the EU. "EU-only" without configuration
          evidence is an unauditable claim.

  Art30:
    title: "Records of processing activities"
    controls:
      - id: "Art30-01"
        description: "Processing activities recorded"
        evidence: "jolarca-compliance (RoPA/ERoPA)"
        enforcement: "manual review"
        status: "implemented"
        note: >
          D-31 documents that the RoPA master register and per-system records
          are PUBLICLY READABLE on GitHub (jolarca-compliance is public).
          While the records exist (satisfying Art. 30), their public exposure
          is a GDPR Art. 5(1)(f) and Art. 32 concern — a complete map of the
          PII and payment estate for anyone planning an attack.
      - id: "Art30-02"
        description: "Repository asset inventory maintained and reconciled"
        evidence: "repos/*.yml is the inventory (ISO 27001 A.5.9); drift_detect.py reconciles it with the live org weekly"
        enforcement: "compliance-scan.yml"
        status: "implemented"
      - id: "Art30-03"
        description: "Access logs retained independently of the platform"
        evidence: "org-settings.tf declares github_organization_webhook gated on var.audit_webhook_url, which is EMPTY — no webhook exists"
        enforcement: "none active"
        status: "gap"
        note: "The GitHub org audit log is queryable by an owner (RB-06 step 2) but is neither streamed nor retained outside GitHub's own retention window. For a KYC/AML scope this should be closed."
      - id: "Art30-04"
        description: "Consent registry registered as a distinct processing activity in the RoPA"
        evidence: >
          jolarca-consent processes personal data (subject_id UUID, IP address,
          user agent, timestamps). It is a separate service from jolarca (the
          product) and from jolarca-compliance (governance). ADR-0001 documents
          the separation, but the RoPA in jolarca-compliance must register the
          consent registry as a distinct processing activity with its own:
          purpose, lawful basis, data categories, recipients, retention period,
          and security measures.
        enforcement: "manual review of jolarca-compliance/ropa/"
        status: "gap"
        note: >
          The consent registry is a separate controller/processor relationship.
          It receives personal data from the product, stores it, and provides
          DSR exports. Each of these is a processing activity that must appear
          in the RoPA. The lawful basis for the consent registry's own
          processing (storing consent records) differs from the lawful basis
          for the product's processing (the consent itself). This distinction
          must be recorded.

  Art32:
    title: "Security of processing"
    controls:
      - id: "Art32-01"
        description: "Access control via role-based permissions"
        evidence: "gh api orgs/jolarca-dev/teams -> empty; all access via single org ownership; default_repository_permission = read"
        enforcement: "none"
        status: "gap"
        finding: "D-10, D-19"
      - id: "Art32-02"
        description: "Multi-factor authentication for all access to the processing environment"
        evidence: "two_factor_requirement_enabled = TRUE (verified 2026-10-01)"
        enforcement: "GitHub org setting — manual"
        status: "implemented"
        note: "D-18 resolved. 2FA enforced org-wide."
      - id: "Art32-03"
        description: "Encryption in transit for all git operations"
        evidence: "SSH remotes (git@github.com:jolarca-dev/*.git) and HTTPS-only GitHub endpoints"
        enforcement: "platform + remote protocol policy"
        status: "implemented"
      - id: "Art32-04"
        description: "Encryption at rest for infrastructure state and backups"
        evidence: "Terraform state is an unencrypted local file (D-02); marketplace infra targets GCP with CMEK required by OPA policy (jolarca-infrastructure terraform/policies/require-cmek.rego)"
        enforcement: "OPA policy for cloud resources; NONE for Terraform state"
        status: "gap"
        finding: "D-02"
        severity: "blocking"
      - id: "Art32-05"
        description: "Vulnerability scanning on all pull requests"
        evidence: "dependency_scan + sast + container_scan + iac_scan gates; required contexts verified live on jolarca"
        enforcement: "policy/compliance-gates.yml + branch protection"
        status: "implemented"
      - id: "Art32-06"
        description: "Integrity and non-repudiation of changes"
        evidence: "required_signature = null on all six repos; operator signing is policy-only"
        enforcement: "commit_signing_policy (not technical)"
        status: "accepted"
        finding: "D-05"
      - id: "Art32-07"
        description: "Restore availability and access to data in a timely manner"
        evidence: "jolarca-infrastructure backup/restore-drill.md and borg offsite configuration"
        enforcement: "documented + drilled outside this repository"
        status: "implemented"
        note: "Restore drills cover application data. Terraform state has NO backup at all — D-02."
      - id: "Art32-08"
        description: "Regular testing and evaluation of control effectiveness"
        evidence: "scripts/org_delivery_audit.sh captures the live delivery chain fleet-wide; RB-05 quarterly review"
        enforcement: "RB-05"
        status: "implemented"

  Art33:
    title: "Notification of a personal data breach"
    controls:
      - id: "Art33-01"
        description: "Breach detection and internal escalation documented"
        evidence: "SECURITY.md incident table; docs/runbooks.md RB-03, RB-06, RB-07"
        enforcement: "documented procedure"
        status: "implemented"
      - id: "Art33-02"
        description: "72-hour supervisory-authority notification process defined"
        evidence: "jolarca-compliance breach procedure; SECURITY.md states the 72-hour obligation"
        enforcement: "documented procedure"
        status: "implemented"
      - id: "Art33-03"
        description: "Secret exposure detected automatically"
        evidence: "secret_scanning_push_protection declared in repositories.tf; gitleaks is a required context on jolarca (verified live)"
        enforcement: "security_and_analysis + CI"
        status: "pending-adoption"
      - id: "Art33-04"
        description: "Consent-specific breach runbook: hash-chain compromise, DB role escalation, consent-record tampering"
        evidence: >
          jolarca-consent docs/threat-model.md enumerates 10 threats (T1–T10)
          including chain forgery, DBA tampering, and API key compromise. But
          no breach runbook maps these to the 72-hour notification obligation.
          If the hash chain is compromised, the controller must assess whether
          personal data (subject_id, IP, user agent) was accessed — and if so,
          notify the supervisory authority within 72 hours and potentially
          communicate to affected data subjects (Art. 34).
        enforcement: "none active — untested runbook = no runbook (ISO 27001 A.5.24–5.28)"
        status: "gap"
        note: >
          ISO 27001 A.5.24–5.28 require incident response planning AND testing.
          A breach runbook that has never been rehearsed is not a control — it
          is a hypothesis. The consent registry's unique breach scenarios
          (chain compromise, DBA tampering, API key abuse) need a dedicated
          runbook with: (1) detection criteria, (2) containment steps,
          (3) assessment of personal data exposure, (4) 72h notification
          template, (5) data-subject communication criteria (Art. 34),
          (6) annual rehearsal schedule.

  Art35:
    title: "Data Protection Impact Assessment"
    controls:
      - id: "Art35-01"
        description: "DPIAs conducted for high-risk processing"
        evidence: "jolarca-compliance DPIA records; jolarca-infrastructure docs/DPIA-template.md"
        enforcement: "manual review"
        status: "implemented"
      - id: "Art35-02"
        description: "DPIA trigger assessed before new processing begins"
        evidence: "jolarca-infrastructure docs/compliance/dpia-trigger-check.md pattern; repos/*.yml data_classification is the trigger input"
        enforcement: "RB-01 step 2 makes classification mandatory before a repo exists"
        status: "implemented"
      - id: "Art35-03"
        description: "KYC/AML identity data treated as high-risk by default"
        evidence: "jolarca is scoped 'PCI-DSS payments, KYC/AML, VAT OSS'; pci-dss applies to every repo in this fleet"
        enforcement: "policy/compliance-gates.yml — pci-dss on all gates"
        status: "implemented"
        note: "Identity documents collected for KYC may engage Art. 9 special-category processing depending on what is verified. That determination belongs in the DPIA in jolarca-compliance, not here."

  Art44:
    title: "International transfers"
    controls:
      - id: "Art44-01"
        description: "GitHub (US-based processor) transfer covered by an adequacy mechanism"
        evidence: "EU-US Data Privacy Framework certification + GitHub DPA"
        enforcement: "legal review; DPA held in jolarca-legal"
        status: "accepted"
      - id: "Art44-02"
        description: "Cloud infrastructure resides in the EU"
        evidence: "jolarca-infrastructure terraform/environments/production/variables.tf region default = europe-west1; policy/repo-defaults and ADR text state EU residency is mandatory"
        enforcement: "terraform variable default + OPA policy"
        status: "implemented"
        note: "Corrected 2026-09-25. The inherited checklist claimed Terraform state was stored in AWS eu-central-1 with SSE. There is no AWS backend anywhere in the marketplace tree — state is a local file (D-02). A false data-residency claim is a materially worse audit finding than the underlying gap."
      - id: "Art44-03"
        description: "Terraform state residency is known and controlled"
        evidence: "state lives on the operator host at /opt/jolarca; no cloud region, no declared residency"
        enforcement: "none"
        status: "gap"
        finding: "D-02"

summary:
  total_controls: 35
  implemented: 20
  pending_adoption: 2
  gap: 11
  accepted: 2
  blocking_gaps: ["Art32-04 (D-02 partial — cloud backend configured, state migration pending)"]
  consent_service_gaps:
    - "Art5-03 — retention schedule not enforced as code"
    - "Art7-01 — consent UX not reviewed for dark patterns"
    - "Art12-01 — DSAR pipeline is consent-only, not cross-service"
    - "Art28-03 — consent-data subprocessor register incomplete"
    - "Art30-04 — consent registry not registered as distinct processing activity"
    - "Art33-04 — no consent-specific breach runbook"
    - "Art37-01 — DPO appointment decision not documented"
  auditor_note: >
    The original 28-control checklist covered the control plane's policy
    assertions. The 10 new controls (Art7-01, Art12-01, Art28-03, Art30-04,
    Art33-04, Art37-01, Art5-03, plus three Art. 30 corrections) address the
    consent service specifically. Seven of the new controls are gaps — the
    consent registry has strong technical foundations (append-only, hash chain,
    ADR-0003 anonymize-don't-delete) but the organizational and procedural
    controls that make the technical controls legally defensible are missing.
    A technically perfect consent chain is not lawful if the UX is coercive
    (Art. 7-01), the DSAR pipeline cannot meet the 30-day deadline across all
    systems (Art. 12-01), or the DPO decision is undocumented (Art. 37-01).
  control_plane_note: >
    Two of three blocking gaps have been resolved: Art5-02 (D-01 resolved via
    forced-public migration, risk accepted) and Art32-02 (D-18 resolved, 2FA
    enforced org-wide). One blocking gap remains: Art32-04 (D-02, Terraform
    state remote backend partially configured — cloud block added, state
    migration pending HCP Terraform account creation).
  consent_repo_note: >
    jolarca-consent is NOT a git repository (no .git) and has never received
    a first commit. Several code-level defects were identified in the working
    copy but cannot be fixed from this control plane: (1) SECRET_KEY is a
    hardcoded placeholder in project/settings/base.py — a known key in a public
    repo lets an attacker forge sessions, CSRF tokens, and password-reset
    tokens; (2) ci.yml runs `mypy --strict .` which checks 15 files including
    untyped Django apps (16 errors) instead of bare `mypy --strict` which
    would use the configured 2-file scope; (3) pytest runs without coverage
    enforcement. These must be remediated in the consent repo before first
    commit.
