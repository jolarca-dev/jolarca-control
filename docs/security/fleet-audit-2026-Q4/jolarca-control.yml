# ──────────────────────────────────────────────────────────────────────────────
# Fleet Audit 2026-Q4 — repository record: jolarca-control (the control plane)
# ──────────────────────────────────────────────────────────────────────────────
# This is the repository that defines what "correct" means for the other 16.
# Audited against itself: every claim below cites a file, a line, or a command
# that was actually run — including three of this repo's own controls, which
# were tested by experiment rather than by reading.
# Status vocabulary inherited from audit/soc2-checklist.yml (lines 9-21).
# ──────────────────────────────────────────────────────────────────────────────

framework_evidence: "jolarca-dev/jolarca-control"
version: "fleet-audit-2026-Q4"
owner: "jolarca-dev organization owner (single operator — D-10)"
verification_date: "2026-10-26"
verification_method: >-
  read-only gh api + git + local gate runs, plus one deliberate experiment:
  scripts/hash_evidence.sh was copied to an isolated tree under /tmp, a file
  registered, the file deleted, and --check re-run. No repository file was
  destroyed to learn this.

baseline:
  branch: "docs/register-data-stores-d79"
  commit_sha: "1ef4f9b05addc795a1dc8cafa18f1049ca7932fa"
  origin_main_sha: "bdbe971e3f2df25c0e3e57b3faab968f06351b4b"
  branch_state: "1 ahead / 1 behind origin/main; PR #85 OPEN, mergeable=MERGEABLE, mergeStateStatus=BEHIND"
  open_prs: 7
  uncommitted_at_audit_start: "clean apart from 2 untracked audit docs"
  scripts: 15
  test_files: 15
  test_lines_of_python_and_shell: 5288
  pytest_collected: 277

controls:
  - id: "FA-control-01"
    description: "The evidence-integrity gate detects evidence that is no longer there"
    evidence: >-
      EXPERIMENT (isolated /tmp tree, scripts/hash_evidence.sh copied verbatim):
      registered policy/a.yml, then deleted the file, then ran --check.
      Output: "Evidence check: 0 files scanned, 0 mismatches / OK: all registered
      evidence hashes match", exit code 0. The check loop (lines 77-116) iterates
      files found on disk and never asks whether every registered row still has a
      file. The precondition guard (lines 52-64) covers a missing or header-only
      baseline, but there is no floor on the scanned count.
      Current real state, measured: 52 rows, 0 registered-but-missing — so this is
      a detection gap, not an active loss.
    enforcement: "scripts/hash_evidence.sh --check · make evidence-check"
    status: "implemented"
    finding: "FA-control-01"
    severity: "S1"
    frameworks: ["SOC 2 CC4.1", "ISO/IEC 27001 A.5.31", "PCI-DSS 12.10.1"]
    note: >-
      FIXED — LANDED ON main AS e5b9b3f (PR #89) 2026-10-26. --check now runs a reverse pass over every
      registered path (MISSING -> exit 1) and refuses to report OK when nothing was
      compared (exit 2). Negative controls live in the new
      tests/test_hash_evidence.sh (19 cases). Compensating control still worth
      naming: git history records the deletion, so the loss was always discoverable
      by anyone who diffed the tree — but the GATE exists so auditors need not, and
      AGENTS.md §7 is the rule this broke: a gate that reports green has not been
      shown to detect anything. Running the fixed gate against a clean clone is what
      exposed FA-control-10.

  - id: "FA-control-02"
    description: "Evidence integrity is enforced on the merge path"
    evidence: >-
      Live required contexts on main (4): Validate Repo Allow-List, Policy
      Compliance Check, Repository Secret Pattern Scan, SAST (semgrep).
      evidence-integrity.yml's job name is 'Evidence Integrity Check' —
      NOT among them. It triggers on schedule + pull_request (paths
      docs/adr/**, audit/**, policy/**, repos/**, docs/runbooks/**,
      docs/security/**, the registry itself, and hash_evidence.sh), so it runs
      and reports, and cannot block.
    enforcement: "GitHub required_status_checks + new step in the required job"
    status: "implemented"
    finding: "FA-control-02"
    severity: "S1"
    note: >-
      FIXED — LANDED ON main AS e5b9b3f (PR #89) 2026-10-26, the way this repo already enforces every
      other policy gate:
      `bash scripts/hash_evidence.sh --check` now runs as a step INSIDE the required
      Validate Repo Allow-List job, so evidence integrity blocks a merge with no
      branch-protection change at all.
      Making 'Evidence Integrity Check' itself a required context was proposed by
      this audit and WITHDRAWN on measurement: that workflow's pull_request trigger
      is path-filtered to eight patterns, so a PR touching anything else could never
      report the context and, under strict=true, would sit 'Waiting for status to be
      reported' forever. scripts/check_required_context_baseline.py:140-141 already
      refuses a path-filtered job as a required-check backstop — the repo's own gate
      would have rejected the change this audit first proposed.
      The workflow logic was never the problem: its header (lines 36-48) documents
      removing the register step after the tautology was found.

  - id: "FA-control-03"
    description: "Tests that prove the safety gates can fail are merge-blocking"
    evidence: >-
      'Regression Tests' (compliance-scan.yml job `test`) is NOT a required
      context. It contains the repo's negative controls:
      tests/test_check_plan_safety.sh (25 cases), tests/test_state_backup.sh
      (10 cases, incl. skip-verify-is-not-a-pass exit 2), and
      `python -m pytest tests/ -q` (277 tests). Measured exit 0 today, so the
      controls currently pass — but nothing prevents a PR that breaks them.
    enforcement: "GitHub required_status_checks — absent for this job"
    status: "gap"
    finding: "FA-control-03"
    severity: "S1"
    note: >-
      apply.yml runs scripts/check_plan_safety.sh before -auto-approve. If the
      fixtures regress in a merge that also touches an apply path, the refusal
      gate is weaker than its own test suite believes, and CI will not have
      objected.
      NOT fixed here, deliberately: promoting this job to a required context is a
      live branch-protection mutation. AGENTS.md §5 forbids out-of-band
      `gh api -X PATCH`, the rules are Terraform-owned, and check_plan_safety.sh
      refuses protection attribute changes in either direction (D-61) until
      state-migration runbook step 6 closes. It is an operator decision, not
      something a docs PR can smuggle. The job's own comment claiming it 'is a
      required context' was corrected in the same edit that added the fixtures.

  - id: "FA-control-04"
    description: "Declared mandatory gates are executed somewhere"
    evidence: >-
      policy/compliance-gates.yml#code_quality is enforcement:"mandatory",
      tier governance required list includes code_quality, and its python tool
      list contains "pytest --cov --cov-fail-under=80". Measured: compliance-
      scan.yml:180 runs `python -m pytest tests/ -q` (no --cov), and
      pyproject.toml contains NO [tool.coverage] block and no fail_under.
    enforcement: "none — the flag is not passed anywhere"
    status: "declared"
    finding: "FA-control-04"
    severity: "S2"
    note: >-
      Same defect class the repo found in jolarca-consent (their A-10, fixed
      there on 2026-09-28 by adding the flag). Here the mandate is unmet in the
      repo that writes the mandate. Honest qualifier: coverage is a proxy, not a
      control — this repo's real assurance is the negative-control fixtures, and
      those DO run (they are just not required, see FA-control-03).

  - id: "FA-control-05"
    description: "Every gate has a test that proves it detects its defect class"
    evidence: >-
      Measured after merging origin/main on 2026-10-26: 16 scripts, 13 with a dedicated
      tests/test_<script> file. Three without one: check_fleet_separation (.sh),
      org_delivery_audit (.sh), and check_secret_inventory (.sh) — the last landed from
      PR #86 while this audit was running, which is the finding recurring rather than a
      one-off: nothing in CI asks whether a new gate has a negative control. At first
      measurement the uncovered three were check_fleet_separation, hash_evidence and
      org_delivery_audit; hash_evidence is now covered by the 19-case fixture added in
      this PR. Re-measured after the parity gate was written: 17 scripts, 15 with a
      fixture, 2 baselined with a dated reason and a ceiling of 2 (R4 only lets it
      shrink). The rule itself is now scripts/check_gate_parity.py, run inside the
      required Validate Repo Allow-List job, so a PR that adds scripts/<name> without
      tests/test_<name> fails a required context instead of merging quietly.
    enforcement: "scripts/check_gate_parity.py R1/R1b/R2/R3/R4 inside required context Validate Repo Allow-List"
    status: "implemented"
    finding: "FA-control-05"
    severity: "S2"
    note: >-
      The durable fix was not three more files: it is a gate that fails a PR adding
      scripts/<name> without a matching tests/test_<name>, plus R2 (a shell fixture must
      be invoked by a workflow that can trigger on pull_request, because `pytest tests/`
      cannot collect .sh) and R3 (a script must be invoked by something executable, parsed
      not grepped, because a comment is documentation). check_secret_inventory.sh now has
      its own 19-case fixture and tests/test_check_workspace_execution_mode.sh's 13 cases
      run on the merge path. Two named exceptions remain and are recorded in the gate's own
      NO_FIXTURE_BASELINE with the reason each is tolerated: check_fleet_separation.sh and
      org_delivery_audit.sh. FA-control-03 still governs whether the FIXTURE job's results
      can block: the parity gate is required, but the fixtures it checks run in the
      advisory Regression Tests job.

  - id: "FA-control-06"
    description: "Code standard gates block a merge"
    evidence: >-
      'Lint' (ruff check, ruff format --check, mypy, shellcheck -x scripts/*.sh
      tests/*.sh, yamllint -c .yamllint .) and 'Terraform Format'
      (terraform fmt -check) both run on pull_request and are NOT required
      contexts. Measured today: make lint exit 0, 277 passed.
    enforcement: "advisory"
    status: "gap"
    finding: "FA-control-06"
    severity: "S2"
    note: "Contributes to FA-control-03: 4 of 14 reported job names can block."

  - id: "FA-control-07"
    description: "Signed commits are enforced where policy claims they are"
    evidence: >-
      branches/main/protection.required_signatures.enabled = false on this repo,
      while git commit -S is a stated convention (CONTRIBUTING/AGENTS §6) and
      jolarca-consent's three main commits all returned verification.verified=true.
    enforcement: "convention only"
    status: "accepted"
    finding: "FA-control-07"
    severity: "S2"
    note: "D-05 pattern. Must not be described as an enforced control."

  - id: "FA-control-08"
    description: "The CI apply path is understood and current"
    evidence: >-
      apply.yml triggers: push to main paths repos/**, policy/**, *.tf, *.tfvars,
      .github/workflows/apply.yml, plus workflow_dispatch. Job prod-apply declares
      environment: production (line 57-59) — therefore the environment secret
      TF_GITHUB_TOKEN IS reachable by that job. Repo-level secrets are
      TFC_TOKEN and TF_GITHUB_TOKEN_READONLY; org-level secrets: none.
      actions/variables: STATE_MIGRATION_COMPLETE=true.
      Environment production protection, measured:
      [{type: wait_timer, wait_timer: 30}, {type: required_reviewers,
      reviewers: [JourneyOfLife], prevent_self_review: false}],
      can_admins_bypass=false.
      apply.yml run history, last 8 (2026-10-15..2026-10-17): 4 failure, 4
      cancelled — no success in that window.
      D-82 read, 2026-10-26, from the HCP side with the operator's own CLI credential (never
      printed): `GET /api/v2/organizations` -> 200 listing jolarca-dev; the workspace exists
      (ws-w6NSnTXXmYgh78Su, execution-mode local, terraform 1.16.5, resource-count 48, locked
      false); `…/runs` -> 200 with THREE runs total since org creation 2026-10-10, every one
      `source: terraform+cloud` / `Triggered via CLI`. So the GitHub-side apply failures were
      never reaching HCP at all: no Actions-originated run has ever existed, and the 48-resource
      state is what the last CLI run left. The caller also lacks can-queue-run/can-queue-apply,
      which bounds what even this credential could do if it were used from CI.
    enforcement: "apply.yml + check_plan_safety.sh + prevent_destroy + wait_timer"
    status: "pending-adoption"
    finding: "FA-control-08"
    severity: "S1"
    note: >-
      Two conclusions, stated carefully. (1) The reviewer requirement is
      self-approval: the sole operator is both author and the only listed
      reviewer, and prevent_self_review is deliberately false — so the 30-minute
      wait is a cancel window, not an approval. (2) No successful apply in the
      visible window means the pre-apply refusal gate has never been exercised in
      production against a real plan; its 25 fixtures are the assurance, and the
      fixtures are not merge-blocking (FA-control-03).

  - id: "FA-control-09"
    description: "Corrections to the control plane's own record land promptly"
    evidence: >-
      7 open PRs on this repo: #85 D-79 (2026-10-19, BEHIND), #84 D-77
      (2026-10-19), #82 ruff bump (2026-10-19), #79 (introduces the id its own title
      cites; unmerged, so that id has no row on main) (2026-10-17), #68
      upload-artifact bump (2026-10-12), #54 D-33 rehearsal (2026-10-07), #40
      dead-path fix (2026-10-05).
    enforcement: "none"
    status: "gap"
    finding: "FA-control-09"
    severity: "S2"
    note: >-
      Restates PDA-10 with today's numbers: #40 and #79 are the PRs whose subject
      is documentation accuracy, unmerged 9-19 days, so main still carries the
      text they were opened to fix.

  - id: "FA-control-10"
    description: "Every registry row names a file the repository actually contains"
    evidence: >-
      Found by running the FA-control-01 fix against a clean clone rather than the
      working tree: git clone of the branch into /tmp, new script overlaid, --check
      -> "46 files scanned, 26 mismatches / FAIL: 26 registered evidence file(s)
      no longer exist", exit 1. The 26 rows are
      docs/security/pre-deployment-audit-2026-10-25/* — present on disk, never
      committed (git status showed 44 untracked files there, git ls-files 0).
      Before the fix, CI checked 46 files, found nothing, and reported OK: the 26
      attestations were vacuously true in the only environment that matters.
      Publication risk checked first because this repo is PUBLIC: gitleaks dir over
      471 KB -> no leaks; no private-key or token-shaped material; the only emails
      are the role mailboxes the fleet already publishes in SECURITY.md plus the
      GitHub noreply identity (D-59).
    enforcement: "scripts/hash_evidence.sh --check (reverse pass) + tracked-tree enumeration"
    status: "implemented"
    finding: "FA-control-10"
    severity: "S1"
    frameworks: ["SOC 2 CC4.1", "ISO/IEC 27001 A.5.31", "GDPR Art. 5(2)"]
    note: >-
      Root cause is the gate's INPUT, not just its check: register mode walked the
      working tree, so it could attest files git had never seen. Fixed at the root —
      enumeration is now `git ls-files -z` (the same scope scripts/check_findings_register.py
      uses), a non-repo or empty index is exit 2, and a fixture proves an untracked file
      under an evidence directory acquires NO row. Consequence for this PR: the
      pre-deployment-audit-2026-10-25 sweep directory is left untracked, because its raw
      `gh pr list` output quotes an id that only unmerged PR #79 defines; committing it
      would need either falsifying captured evidence or widening the citation gate's
      exclusions, and AGENTS.md §5 forbids both. Its 26 rows therefore leave the registry,
      which is the honest state: the registry now attests 46 files, all of them in git.
      Verification practice adopted: run --check in a clean clone, not only in the working
      tree — a green local run proves nothing about the committed tree.

  - id: "FA-control-11"
    description: "A shipped control must produce a verdict somebody reads (readable input + an invoker)"
    evidence: >-
      scripts/check_secret_inventory.sh landed on 2026-10-20 in PR #86 (adds commit bdbe971)
      with two independent silences. (1) INPUT: its default argument was
      docs/SECRETS_INVENTORY.md and `git log --all --oneline --diff-filter=A --
      docs/SECRETS_INVENTORY.md` returns 0 lines, `git ls-files` 0 — the file has never existed
      on any branch, so running it exactly as documented printed
      "::error::docs/SECRETS_INVENTORY.md not readable — an unreadable register is not a pass"
      and exited 2, forever, correctly. (2) INVOKER: `git grep -n check_secret_inventory
      origin/main -- Makefile '.github/workflows'` → exit 1 (no matches); `git grep -l` finds it
      only in prose (key-custody.md and this audit's own records). Meanwhile
      docs/security/key-custody.md:33 declares its table "the single `expires`-bearing block the
      gate parses", and `:41` sets TFC_TOKEN `expires = unknown` with "until then the gate is red by
      design" — pointed at the real register today it exits 1 after two `ok:` rows. A control
      designed to be red, wired to nothing, reports green forever: the fail-closed signal was
      swallowed by absence, not by `||` or continue-on-error. Same class, second instance: tests/
      test_check_workspace_execution_mode.sh (13 cases, self-reported "13 passed, 0 failed") was
      invoked by the Makefile only, and `pytest tests/` cannot collect .sh, so it could never fail
      a merge (origin/main had four .sh fixtures, three wired).
    enforcement: "scripts/check_gate_parity.py R2/R3 (required context) + default path repaired + advisory step in deploy-gates.yml"
    status: "implemented"
    finding: "FA-control-11"
    severity: "S1"
    frameworks: ["SOC 2 CC4.1", "SOC 2 CC7.1", "ISO/IEC 27001 A.8.8", "PCI-DSS 8.3.1"]
    note: >-
      Recorded as S1 for the same reason FA-control-01 was: the repository documents a monitoring
      control that was not operating, so a Type I description written from key-custody.md would be
      inaccurate, and the evidence registry attests the file's bytes, not its effect. What this
      row does NOT close: the TFC_TOKEN expiry itself (a production-scope GitHub secret whose
      date HCP Terraform describes only to a holder of it — CANNOT VERIFY from here, §3), and any
      claim about the other 16 repositories (the parity gate reads this repo's Makefile and
      workflows only). Deliberate design choice, stated rather than hidden: the gate is wired into
      deploy-gates.yml, an ADVISORY job — "Deploy Gates" is not among the four required contexts —
      because promoting an intentionally-red check to a required context would wedge every PR
      (A-01's deadlock shape). Its fixture tests/test_check_secret_inventory.sh (19 cases) does
      run on the merge path, so the script's behaviour is protected even while its verdict is
      advisory. Observed while measuring and not acted on: check_findings_register.py parses
      `D-\d+`, so a sub-lettered id would be invisible to both the heading parse and the citation
      scan. Corrected 2026-10-26 (D-81 follow-up): this note asserted that case exists — "the
      sub-lettered heading D-22a (docs/drift-findings.md:235)" — and it does not. `grep -nE '^###\s+D-[0-9]+[a-z]'
      docs/drift-findings.md` returns nothing, and line 235 is a prose bullet quoting D-22's regex
      inside backticks. `D-22a` appears at :265 and :328 as prose only. So the parse gap is LATENT,
      not observed: harmless today, a trap for the first sub-lettered id, and the earlier claim was
      itself the class this audit keeps recording — a cited artefact not re-read before asserting it.

  - id: "FA-control-12"
    description: "Change management must distinguish a considered change from an unattended one"
    evidence: >-
      apply.yml triggers on push:main for repos/**, policy/**, *.tf, *.tfvars and itself, then runs
      `terraform apply -input=false -auto-approve tfplan`. Because AGENTS.md §5 requires actions to
      be pinned to a full SHA, the pins live inside the workflow files, so dependency automation
      writes into the apply trigger by construction. Measured on the two open Dependabot PRs:
      `gh pr diff 87 --name-only` (setup-python 7.0.0->7.1.0) and `gh pr diff 68 --name-only`
      (upload-artifact 7.0.1->7.0.2) both include `.github/workflows/apply.yml`. Before this change
      nothing said that merging a version bump is a deploy decision — not in the PR body, not in a
      check, not in policy/compliance-gates.yml, whose D-58 exception already concedes that no
      person signs the apply and that the 30-minute wait is delay plus a cancel window.
    enforcement: "scripts/check_apply_path_trigger.py as a step inside required context Validate Repo Allow-List (pull_request events)"
    status: "implemented-pending-merge"
    finding: "FA-control-12"
    severity: "S2"
    frameworks: ["SOC 2 CC8.1", "ISO/IEC 27001 A.8.32", "PCI-DSS Req 12.10.1"]
    note: >-
      Asymmetric by design and stated in the script: a bot/app PR touching an apply-path file exits
      1 (refused pre-merge, where a human can author the same diff deliberately), a human PR exits
      0 with a NOTICE (refusing Terraform work would manufacture the A-01/FA-control-03 deadlock).
      This is therefore not the dependency-bump deadlock class — the bump stays mergeable, by a
      person. Trigger patterns are READ from apply.yml's own on.push.paths (T1) so the gate cannot
      drift from the workflow the way the required-context baseline did (D-62); T5 refuses a trigger
      set the script cannot model (`!` exclusions, `paths-ignore`) instead of approximating it. The
      fixture count is 21 collected, counted by `pytest --collect-only`.
      Three defects were caught before this shipped, which is the point of writing the fixtures
      first: (a) `lstrip("./")` silently unmatchable `.github/...` (found by running the gate against
      live `gh pr diff` output, where it reported clean on exactly the PRs to refuse); (b) `gh pr view
      --json author --jq .author.type` returning an empty string, which would have handed the gate an
      unknown actor kind; (c) the step could not run at all — it calls `gh api …/pulls/<n>/files`
      inside a job whose own `permissions:` block sets every unspecified scope to `none`, so the
      workflow-level `pull-requests: read` never reached it, and the 403 would have reddened the
      REQUIRED context on every PR in the repository. (c) is pinned by a fixture that reads the
      workflow YAML, proved by deleting the line (`assert None == 'read'`) and restored.
      Related but separate: merging these two bumps is NOT
      done here — it is the operator's call, and D-77/D-82 mean an apply attempt currently dies at
      HCP init anyway, so no apply has ever happened from CI (three runs total since org creation,
      all CLI-triggered).

  - id: "FA-control-13"
    description: "The three gate surfaces (`make lint`, the pre-commit hooks, the CI jobs) must be compared, not assumed equal"
    evidence: >-
      Measured 2026-10-26 while landing FA-control-12: `make lint` exited 0 (313 passed) on a branch
      where `ruff format --check scripts/ tests/` — a step the CI `Lint` job runs and `lint` did not —
      reported "1 file would be reformatted, 24 files already formatted" (13 hunks in the new fixture
      file). The Makefile row for `lint` reads "Everything CI runs before a plan".
      This row was first written as the absence "nothing local enforces the formatter" at S2, and that
      premise was refuted by two commands: `.pre-commit-config.yaml` declares `id: ruff-format`, the
      hook is installed (`.git/hooks/pre-commit`, 2026-09-26), `pre-commit run --all-files` passes all
      twelve hooks, and the commit attempt that prompted the check was itself refused by
      `end-of-file-fixer`. What is actually true is narrower: three overlapping surfaces (lint,
      hooks, CI) exist and none of them is compared to another, so a command present in one list and
      absent from a second is invisible to anyone who runs only the list they were told to run — and
      AGENTS.md §2 tells an agent to run `make lint`, which this session did dozens of times without
      invoking the hooks once. Hooks see staged files only; a fresh CI clone has no hooks at all.
    enforcement: "py-fmt-check now runs inside `make lint`; nothing compares the three lists"
    status: "gap"
    finding: "FA-control-13"
    severity: "S3"
    frameworks: ["SOC 2 CC4.1", "ISO/IEC 27001 A.8.32"]
    note: >-
      Graded S3 rather than the S2 first drafted, on the measured premise: the formatter has a live
      local enforcer and the `Lint` job is not a required context, so no merge was ever at risk and no
      control was inert. The fix that landed is the specific gap (D-83: `py-fmt-check` added to `lint`,
      a gate strengthened, never weakened — §5). The general class stays open:
      check_gate_parity.py R2 asks whether a fixture that exists is invoked in CI, never whether every
      command in CI, `lint` and the hooks appears in the other two. Writing that rule is itself a gate
      change and needs its own negative control, so it is recorded here as a gap rather than closed by
      assertion. Second-order value of this row: it is the audit catching its own overstatement, which
      is the same discipline that caught D-81's inert `lstrip` — asserted absences are the cheapest
      claims to test and the most expensive to leave untested.

strengths:
  - "5 policy gates run INSIDE the required Validate Repo Allow-List job: validate_repos.py, check_required_context_baseline.py, check_declared_contexts.py, check_deploy_gates.py, check_findings_register.py — enforcement is real for those, not advisory"
  - "required contexts are 4 non-empty names that all match live job names, with strict=true, so a red required context genuinely blocks (measured: ctx list equals 4 reported jobs)"
  - "enforce_admins=true, required_linear_history=true, allow_force_pushes=false, allow_deletions=false, required_conversation_resolution=true"
  - "settings match policy/repo-defaults.yml#defaults exactly: squash-only (allow_merge_commit=false, allow_rebase_merge=false), has_projects=false, has_wiki=false"
  - "secret scanning AND push protection enabled here — the repo that failed that test (.github) is not this one"
  - "prevent_destroy=true verified to sit inside resource \"github_repository\" \"repo\" (block opens :25, lifecycle :76-77, closes :90) and on the health repo (health-repo.tf:64) — the AGENTS.md claim survives reading the block, not just grepping the keyword"
