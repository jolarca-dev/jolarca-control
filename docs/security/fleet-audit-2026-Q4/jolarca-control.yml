  - id: "FA-control-16"
    description: "A gate's three-valued exit code must survive the wrapper that documents it"
    evidence: >-
      Measured side by side on identical input, same tree:
      `.venv/bin/python scripts/repo_readiness_audit.py --repo jolarca-data` ->
      exit **1** (findings: `READY-WITH-FIXES`, 0 S0 / 0 S1 / 3 S2 / 2 S3);
      `make readiness REPO=jolarca-data` -> exit **2**, which AGENTS.md section 3
      reserves for "could not verify". Proven at the tool rather than inferred from
      this repo: a synthetic Makefile with a `@exit 1` target also returned **2**,
      so GNU make cannot convey `1` and no `make <gate>` can distinguish findings
      from an unreachable API. Eleven scripts here implement the three-valued
      convention (`grep -ln "exit 2" scripts/*`). Second half, also measured per
      stream because the scripts differ: `repo_readiness_audit.py:2408` prints its
      table to stderr and its detail to stdout, so `readiness` (Makefile:150-154)
      and `first-commit` (Makefile:179-193) ending in `>/dev/null` discarded
      stdout (85 and 128 bytes respectively, both just make echoing the recipe)
      while the one-line table survived on stderr (373 and 808 bytes) — a reader
      saw a terse verdict and a generic error, and had no signal that the findings
      body had been thrown away.
    enforcement: >-
      the two recipes no longer redirect stdout; AGENTS.md sections 2 and 3 state
      that make collapses any non-zero to 2 and that automation must call the
      script directly
