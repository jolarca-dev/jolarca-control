      local annoyance; it is systemic to the command surface AGENTS.md section 2
      publishes, so the documented contract did not survive the documented
      commands. Deliberately not tested by a fixture: the behaviour being described
      is GNU make's exit-status contract, and a test asserting it would test
      make(1), not this repository. The `readiness` fix was verified live after the
