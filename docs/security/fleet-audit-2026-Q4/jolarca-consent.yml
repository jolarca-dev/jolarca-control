framework_evidence: "jolarca-dev/jolarca-consent"
version: "fleet-audit-2026-Q4"
owner: "jolarca-dev organization owner (single operator — D-10)"
verification_date: "2026-10-26"
verification_method: >-
  read-only gh api queries + local clone inspection at
  /opt/jolarca/repos/jolarca-consent (clean tree, HEAD == origin/main) +
  Actions run logs and check-run annotations. No writes performed.

baseline:
  commit_sha: "7e5f84045ae0ff0dc590aa5a60ce4639f26ae1a7"
  branch: "main"
  manifest_fingerprint: "506723d84d4b6feb753ddf9167cd50f739efb86e9915c7651576809112fc9969"
  file_count: 74
  working_tree: "clean (git status --porcelain empty)"
  control_plane_baseline: "jolarca-control 1ef4f9b05addc795a1dc8cafa18f1049ca7932fa"
  stack: "Django 5.2 + DRF + drf-spectacular, PostgreSQL (base), SQLite (dev/test), Python 3.12"

controls:
  - id: "FA-consent-01"
    description: "No change reaches main without a pull request and required green checks"
    evidence: >-
      ruleset 24087580 (enforcement=active, updated_at 2026-09-28T02:07:06,
      unchanged since): rules = deletion, non_fast_forward,
      required_linear_history ONLY. No pull_request rule, no
      required_status_checks rule. bypass_actors=[],
      current_user_can_bypass=never. Legacy endpoint returns HTTP 404
      "Branch not protected" while branches/main .protected=true.
      History check: of 3 commits on main, exactly one PR has ever merged here
      (#6 -> mergeCommit 7e5f84045); 8e3a890bc has no PR with a matching
      mergeCommit and committer=Gintaras Kazlauskas, whereas 7e5f84045 has
      committer=GitHub.
    enforcement: "ruleset covers deletion/force-push only; merge gating is absent"
    status: "gap"
    finding: "FA-consent-01"
    severity: "S0"
    frameworks: ["GDPR Art. 7(1)", "GDPR Art. 5(2)", "SOC 2 CC8.1", "ISO/IEC 27001 change management"]
    note: >-
      8 good CI jobs exist on this repo and none of them can block anything.
      The absence-of-PR comparison is exhaustive over the PR list, but the write
      path itself was not exercised — see not_run.

  - id: "FA-consent-02"
    description: "The consent hash chain is verified against a real PostgreSQL ledger"
    evidence: >-
      Integrity workflow (name "Verify Chain") conclusion=failure on all six
      most recent scheduled runs: 2026-10-21, -22, -23, -24, -25, -26. Step
      "Run migrations"=success, step "Verify chain"=failure. PostgreSQL log from
      run 40286486523: ERROR: relation "consent_registry_consentrecord" does not
      exist; also FATAL: role "root" does not exist (x2).
    enforcement: "schedule + workflow_dispatch only; deliberately NOT a required context"
    status: "gap"
    finding: "FA-consent-02"
    severity: "S1"
    root_cause: >-
      integrity.yml exports DATABASE_URL and runs `python manage.py migrate`, but
      manage.py:10 pins DJANGO_SETTINGS_MODULE=project.settings.dev, and dev.py
      overrides DATABASES to sqlite3. The schema is therefore created in a
      throwaway SQLite file while verify_chain.py connects to the postgres
      service and finds no table.
    note: >-
      The repo's central Art. 7(1) demonstrability control has never run
      successfully in CI, and because the job is not required, nothing surfaces.

  - id: "FA-consent-03"
    description: "Retention-driven anonymization can execute on the production engine"
    evidence: >-
      migrations/0002_add_append_only_triggers.py installs a BEFORE UPDATE
      trigger that RAISE EXCEPTIONs unconditionally; retention.py:141-148
      performs anonymization via ConsentRecord.objects.filter(pk=...).update(...)
      and its docstring states this is used "to bypass the ORM-level immutability
      guard". dev.py and test.py use SQLite; 0002 returns early when
      connection.vendor != postgresql, so no test has ever installed the trigger.
    enforcement: "DB trigger (PostgreSQL) + ORM guard (models.py save/delete)"
    status: "gap"
    finding: "FA-consent-03"
    severity: "S1"
    frameworks: ["GDPR Art. 5(1)(e)", "GDPR Art. 17", "ADR-0003"]
    verification_status: "READ-VERIFIED — NOT RUN against live PostgreSQL"
    note: >-
      ADR-0003 resolves Art. 7(1) vs Art. 17 by anonymizing rather than
      deleting, but the mechanism that anonymizes is an UPDATE that the
      append-only trigger forbids. FA-consent-02 is why this has stayed unseen.

  - id: "FA-consent-04"
    description: "Authentication and authorization configuration is tested as deployed"
    evidence: >-
      project/settings/base.py:139-151 sets
      DEFAULT_PERMISSION_CLASSES=[IsAuthenticated] AND
      DEFAULT_AUTHENTICATION_CLASSES=[] . tests/test_api.py:21-33 and
      tests/test_adversarial.py:26-38 apply @override_settings replacing
      REST_FRAMEWORK with DEFAULT_PERMISSION_CLASSES=[] (no auth at all).
      No test asserts a 401/403 for an unauthenticated request.
    enforcement: "Django settings; DRF defaults"
    status: "gap"
    finding: "FA-consent-04"
    severity: "S1"
    note: >-
      As configured the API refuses every request (no credential can be
      presented), so the service cannot record consent. The suite validates the
      unauthenticated configuration instead, making the deadlock invisible.

  - id: "FA-consent-05"
    description: "Object-level authorization scopes every personal-data read"
    evidence: >-
      views.py:38-61 get_queryset filters by a client-supplied subject_id and
      applies no ownership scope; views.py:122-141 DSRExportView returns all
      records for any subject_id passed in the query string; models.py:40 stores
      subject_id as a UUID with no FK and no caller binding; no permission class
      is declared on either view.
    enforcement: "none"
    status: "gap"
    finding: "FA-consent-05"
    severity: "S1 (latent)"
    frameworks: ["GDPR Art. 15/20", "SOC 2 CC6.1"]
    note: >-
      Unreachable today only because FA-consent-04 blocks all traffic. Fixing
      FA-consent-04 by adding authentication WITHOUT scoping turns Art. 15 export
      into a cross-subject disclosure (BOLA). Both must be fixed together.

  - id: "FA-consent-06"
    description: "A deployable production configuration exists and is proven to boot"
    evidence: >-
      project/settings/ contains base.py, dev.py, __init__.py, test.py — no prod
      module (grep for settings.prod returned nothing). base.py:36 sets
      ALLOWED_HOSTS=[] with DEBUG=False, and base.py:92 sets database
      PASSWORD="" pending Vault injection.
    enforcement: "none"
    status: "gap"
    finding: "FA-consent-06"
    severity: "S2"

  - id: "FA-consent-07"
    description: "Chain construction is safe under concurrent writes"
    evidence: >-
      views.py:80-81 derives prev_hash from
      ConsentRecord.objects.order_by("-timestamp").first() with no select_for_up
      date, no advisory lock and no transaction boundary; entry_hash is unique
      (models.py:78) so two records sharing a prev_hash insert cleanly.
      Timestamps are client-supplied but validated to a +/-5 minute skew
      (tests/test_api.py:165-178 proves the rejection).
    enforcement: "application code"
    status: "gap"
    finding: "FA-consent-07"
    severity: "S2"
    verification_status: "READ-VERIFIED — NOT RUN (no concurrency test exists)"

  - id: "FA-consent-08"
    description: "Secret scanning and dependency review gates are functional"
    evidence: >-
      PRs #11, #10, #9, #2 all report "Gitleaks (secret scanning)" = fail and
      "Dependency review" = fail. Check-run annotation for gitleaks job
      121446022404: "missing gitleaks license. Go grab one at gitleaks.io and
      store it as a GitHub Secret named GITLEAKS_LICENSE". Annotation for
      dependency review job 121446022514: "Dependency review is not supported on
      this repository. Please ensure that Dependency graph is enabled".
      Meanwhile compliance_check.py reports dependabot_alerts_coverage 16/16 pass
      from declared config, and live shows vulnerability_alerts=204 (enabled).
    enforcement: "security.yml jobs; policy declaration"
    status: "gap"
    finding: "FA-consent-08"
    severity: "S2"
    note: >-
      Neither failure is a leak. Both are broken substrates: an unconfigured
      licence and a disabled dependency graph that Dependabot security updates
      (reported enabled) cannot function without.

  - id: "FA-consent-09"
    description: "Declared protection in the control plane matches enforced protection"
    evidence: >-
      repos/jolarca-consent.yml:49-77 declares required_status_checks.strict=true
      with 7 contexts, required_approving_review_count=0, enforce_admins=true.
      Live: no legacy rule (HTTP 404), ruleset carries none of it. Creating the
      declared rule is a branch-protection create, which
      scripts/check_plan_safety.sh refuses until state-migration runbook step 6
      closes (D-61).
    enforcement: "declared only"
    status: "declared"
    finding: "FA-consent-09"
    severity: "S1"
    note: >-
      Circular block: the only Terraform path to enforcement is refused by the
      apply-safety gate, so the gap persists while both controls are honoured.
      Requires an explicit operator decision, not a code change alone.

  - id: "FA-consent-10"
    description: "Red advisory CI signals are triaged rather than accumulated"
    evidence: >-
      "CodeQL (python)" = fail on PRs #9 and #10 (codeql-action 3.38.2 -> 4.39.1
      bumps); PRs #1, #3, #4, #5, #7, #8 are closed unmerged Dependabot bumps;
      3 Dependabot PRs remain open (#2, #9, #10, #11).
    enforcement: "none"
    status: "gap"
    finding: "FA-consent-10"
    severity: "S2"

strengths:
  - "secret_scanning, secret_scanning_push_protection and dependabot_security_updates are all ENABLED here — the opposite of .github"
  - "a real adversarial suite (tests/test_adversarial.py) attempts five distinct tamper paths and asserts 409 invalid for each"
  - "append-only enforced twice: ORM (models.py save/delete raise) and DB trigger (0002) with a documented rationale"
  - "correct Art. 7(1) retention reasoning: active grants are never anonymized, only withdrawn ones past TTL (retention.py:68-103)"
  - "input validation is present and tested: consent_version format, +/-5 minute timestamp skew, withdrawal requires revoked_at, grant forbids revoked_at"
  - "TTLs are marked [COUNSEL-TO-CONFIRM] rather than presented as settled compliance positions"
  - "all three commits on main are cryptographically verified (verification.verified=true, reason=valid)"
  - "ci.yml actions are SHA-pinned with version comments; mypy --strict and a pytest coverage floor of 80 are enforced"
  - "settings fail closed on a missing DJANGO_SECRET_KEY (A-07), and dev/test throwaway keys are explicitly labelled non-production"

not_run:
  - item: "direct push to main (git push origin HEAD:refs/heads/main from a branch)"
    reason: "a write to a GDPR-scoped store; authorization not granted"
    would_prove: "FA-consent-01 exploitability, not merely its configuration"
  - item: "run the test suite against PostgreSQL to observe the anonymize-vs-trigger collision"
    reason: "needs a postgres instance and a settings module that does not exist (FA-consent-06)"
    would_prove: "FA-consent-03 as a runtime defect instead of a source-level contradiction"
  - item: "cross-subject read via GET /api/v1/dsr/export/?subject_id=<other>"
    reason: "blocked by FA-consent-04 (all traffic is refused), so the BOLA cannot be demonstrated today"
  - item: "concurrent POST proving a chain fork"
    reason: "no test harness exists; FA-consent-07 is source-read only"
  - item: "DSR, breach and retention runbooks executed end to end"
    reason: "docs/dsar-runbook.md and docs/breach-runbook.md exist but were not rehearsed in this pass"

verdict: "NO-GO for this repository"
blocking_findings: ["FA-consent-01"]
s1_findings: ["FA-consent-02", "FA-consent-03", "FA-consent-04", "FA-consent-05", "FA-consent-09"]
framework_claims_not_supported:
  - "GDPR Art. 7(1) demonstrability — the tamper-evidence verifier has never run green (FA-consent-02)"
  - "GDPR Art. 5(2) accountability — changes reach the ledger without review (FA-consent-01)"
  - "GDPR Art. 17 / 5(1)(e) — anonymization path unexecutable on the production engine (FA-consent-03)"
  - "SOC 2 CC8.1 change management — no required checks, no PR rule (FA-consent-01)"
  - "SOC 2 CC6.1 least privilege — no authorization model exists (FA-consent-04, FA-consent-05)"
  - "PCI DSS 10.5 (record protection), to the extent consent records are in PCI-adjacent scope"
