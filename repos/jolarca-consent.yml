name: jolarca-consent
description: "Consent management, GDPR compliance, and privacy controls for the jolarca-dev marketplace"
visibility: public
tier: platform
criticality: tier-1
launch_status: planned
language: Python
topics:
- marketplace
- consent
- gdpr
- privacy
- data-protection
- cookie-consent
settings:
  # Licensing posture — an explicit OWNER DECISION recorded 2026-09-28.
  # This is NOT `license_template`: repositories.tf passes license_template
  # straight to github_repository and GitHub accepts only its own template keys,
  # so "proprietary" there would fail the apply. `license` is inert for Terraform
  # and for LIVE_SETTINGS_MAP, and exists so the readiness gate can tell a
  # deliberate all-rights-reserved notice from an undocumented one (L-13b).
  #
  # policy/repo-defaults.yml sets license: null fleet-wide because only the
  # flagship `jolarca` carries an OSS licence (AGPL-3.0, deliberate). That
  # default leaves a PUBLIC repo under implicit default copyright, which is
  # legally sound but unauditable — an assessor must infer intent from silence.
  # jolarca-consent is public, tier-1 and GDPR-scoped, and pyproject.toml
  # already declared `license = { text = "Proprietary — all rights reserved" }`,
  # so the posture is made explicit here and in a committed LICENSE file.
  license: proprietary
  has_issues: true
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
  web_commit_signoff_required: true
branch_protection:
  main:
    pattern: main
    required_status_checks:
      strict: true
      # Contexts are the JOB display names GitHub reports, NOT workflow names.
      # Audit finding A-01 / gate L-19 (2026-09-28): this list declared `ci` and
      # `security`, which no job in .github/workflows/ produces, so the rule was
      # unsatisfiable and would have blocked every merge forever the moment
      # protection was enabled. Every name below is emitted by a workflow that
      # triggers on pull_request, verified against the live job `name:` values.
      # `Verify Chain` (integrity.yml) is deliberately ABSENT: that workflow runs
      # on schedule and workflow_dispatch only, so requiring it as a pre-merge
      # context would deadlock every PR (gate L-20).
      contexts:
      - "Lint (ruff)"
      - "Type check (mypy)"
      - "Test (pytest)"
      - "Repository smoke-check"
      - "Gitleaks (secret scanning)"
      - "Dependency review"
      - "CodeQL (python)"
    required_pull_request_reviews:
      required_approving_review_count: 0
      dismiss_stale_reviews: true
      require_code_owner_reviews: false
      require_last_push_approval: false
    enforce_admins: true
    restrict_pushes: true
    require_signed_commits: false
    require_linear_history: true
    require_conversation_resolution: true
    block_force_pushes: true
    block_deletions: true
teams: {}
compliance:
  frameworks:
  - gdpr
  - soc2
  - iso27001
  - pci-dss
  data_classification: internal
  required_gates:
    dependency_scan: true
    secret_scan: true
    code_quality: true
    security_review: true
