# Allow-list definition for jolarca-data
# Managed by jolarca-control — DO NOT edit outside this repo.
# Compliance: SOC2 / GDPR / ISO 27001 / PCI-DSS 4.0
#
# Settings verified against the live GitHub API on 2026-09-25 EXCEPT
# visibility — BLOCKING DECISION D-01, see docs/drift-findings.md.

name: jolarca-data
description: "Marketplace data schemas and migrations (no production data in git)."

# Declared private per the intent of record (github-org module: "the data repos
# in this fleet are private"). Live reality is PUBLIC. Schema and migration
# files disclose the PII and payment data model — an attacker's roadmap.
# apply.yml refuses visibility changes, so this cannot land silently.
visibility: public

tier: platform
# tier-1: the PII and payment data model. Loss or exposure is directly
# reportable territory (GDPR Art. 33, PCI-DSS Req 12.10).
criticality: tier-1
launch_status: in-development
language: SQL
topics:
- analytics
- data-governance
- data-platform
- data-quality
- dbt
- gdpr
- marketplace
- pii
- retention
- synthetic-data
- warehouse
settings:
  has_issues: false
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
  web_commit_signoff_required: true
branch_protection:
  main:
    pattern: main
    required_status_checks:
      strict: true
      contexts:
      - ci
      - compliance
      - security
    required_pull_request_reviews:
      # SOLO-ERA DEVIATION — D-04
      required_approving_review_count: 0
      dismiss_stale_reviews: true
      # require_code_owner_reviews=false: INERT without jolarca-dev teams
      # (D-10/D-20); matches policy/repo-defaults baseline. Raise to true in the
      # same PR that creates teams and CODEOWNERS owners.
      require_code_owner_reviews: false
      require_last_push_approval: false
    enforce_admins: true
    restrict_pushes: true
    # Deviation D-05
    require_signed_commits: false
    require_linear_history: true
    require_conversation_resolution: true
    block_force_pushes: true
    block_deletions: true
# jolarca-dev has NO teams (verified 2026-09-25). See D-10.
teams: {}
compliance:
  frameworks:
  - soc2
  - gdpr
  - iso27001
  - pci-dss
  data_classification: internal
  required_gates:
    dependency_scan: true
    secret_scan: true
    license_check: true
    code_quality: true
    security_review: true
