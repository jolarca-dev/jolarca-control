# Allow-list definition for jolarca
# Managed by jolarca-control — DO NOT edit outside this repo.
# Compliance: SOC2 / GDPR / ISO 27001 / PCI-DSS 4.0
#
# All settings below were verified against the live GitHub API on 2026-09-25
# so the first post-migration plan is a no-op. Do not "improve" a value here
# without recording the decision in docs/drift-findings.md.

name: jolarca
description: "Marketplace platform application code (PCI-DSS payments, KYC/AML, VAT OSS scope)."
visibility: public
tier: platform
# tier-1: the flagship marketplace application — payments, KYC/AML and customer
# accounts. in-development: the org is not yet live (D-01: nothing is private,
# the control plane is not deployed).
criticality: tier-1
launch_status: in-development
language: TypeScript
topics:
- baltic
- django
- e-commerce
- gdpr
- iso27001
- kyc
- marketplace
- nextjs
- pci-dss
- python
- soc2
- typescript
- vat-oss
settings:
  has_issues: false
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
  web_commit_signoff_required: true
  # AGPL-3.0 is deliberate: jolarca is the open-source marketplace application.
  # It is NOT an exception to policy/compliance-gates.yml license_check — that
  # gate constrains INBOUND DEPENDENCIES, not a repo's own license.
  license_template: agpl-3.0
branch_protection:
  main:
    pattern: main
    required_status_checks:
      strict: true
      contexts:
      - gitleaks
      - codeql
      - docker-scan
      - secrets
      - frontend-typecheck
      - frontend-lint
      - backend
      - trivy
      - dependency-audit
    required_pull_request_reviews:
      # SOLO-ERA DEVIATION — docs/drift-findings.md D-04
      required_approving_review_count: 0
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
      require_last_push_approval: false
    enforce_admins: true
    restrict_pushes: true
    # Deviation D-05: automation commits cannot be GPG-signed. Human operators
    # still sign by policy (git commit -S).
    require_signed_commits: false
    require_linear_history: true
    require_conversation_resolution: true
    block_force_pushes: true
    block_deletions: true
# jolarca-dev has NO teams (verified 2026-09-25) — single-operator org, all
# access via org ownership. Declared empty on purpose; do not invent teams
# here. See docs/drift-findings.md D-10.
teams: {}
compliance:
  frameworks:
  - soc2
  - gdpr
  - iso27001
  - pci-dss
  data_classification: public
  required_gates:
    dependency_scan: true
    secret_scan: true
    license_check: true
    code_quality: true
    sast: true
    container_scan: true
    security_review: true
