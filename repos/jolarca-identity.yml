# Allow-list definition for jolarca-identity
# Managed by jolarca-control — DO NOT edit outside this repo.
# Compliance: SOC2 / GDPR / ISO 27001 / PCI-DSS 4.0
#
# IAM policy, RBAC definitions, joiner/mover/leaver automation, and access
# review procedures for the jolarca-dev marketplace.
# Evidence of access reviews lives in jolarca-compliance, NOT here — this repo
# holds the machinery, not the records.

name: jolarca-identity
description: "Identity management, access control, RBAC policy, and joiner/mover/leaver automation for the jolarca-dev marketplace"
# Private: this repo defines RBAC policy and IAM procedures for a PCI-DSS-scoped
# marketplace. Public readability of access-control rules widens the attack
# surface. Evidence stays in jolarca-compliance (also private).
visibility: public
tier: platform
# tier-1: RBAC policy defines who can access PCI-scoped systems; compromise of
# this repo's policies could grant unauthorised access to the entire marketplace.
criticality: tier-1
# in-development — verified against the live repo 2026-09-26.
# No longer `planned`: created 2026-09-25, 3 commits, 19 files, private.
# Not yet `operational` under the policy/repo-defaults.yml#asset_inventory
# rubric ("actively relied on … authoritative record for a live obligation"):
# only policies/access-control-policy.md and policies/authentication-standards.md
# are "Effective upon publication"; policies/rbac.md is "Effective upon
# population", and roles/role-definitions.md, access-reviews/procedure.md and
# lifecycle/joiner-mover-leaver.md are "Effective upon team creation" —
# jolarca-dev still has ZERO teams and one member (D-10). Nothing has relied on
# the procedures yet: jolarca-compliance/audits/access-reviews/ holds only the
# convention README, no executed review.
# Rubric caveat, corrected 2026-10-04: the CI-absence half of this note is no
# longer true. The repo has .github/workflows/ci.yml and its `CI` workflow runs
# green on main (measured at cb2f778), so the contexts below could not report for
# a different reason entirely -- the jobs published as `shellcheck` and
# `gitleaks (full history)` while [ci, security, lint] was declared. Contexts now
# name the two stable job keys. The zero-teams and no-executed-access-review
# caveats above stand unchanged.
# Promote to `operational` when teams exist AND the first signed access review
# lands in jolarca-compliance.
launch_status: in-development
language: Python
topics:
- marketplace
- identity
- authentication
- authorization
- rbac
- access-control
- iam
- oauth2
- oidc
settings:
  has_issues: true
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
  web_commit_signoff_required: true
branch_protection:
  main:
    pattern: main
    required_status_checks:
      strict: true
      # GitHub names a required check after the job's `name:` when set, else the job
      # key. identity's jobs are `lint` and `secret-scan` (jolarca-identity#3 dropped
      # the display titles so a context cannot drift with its prose). The previous
      # trio [ci, security, lint] matched nothing the workflow can report, so applying
      # it under strict=true would have made every PR there permanently unmergeable.
      contexts:
      - lint
      - secret-scan
    required_pull_request_reviews:
      required_approving_review_count: 0
      dismiss_stale_reviews: true
      require_code_owner_reviews: false
      require_last_push_approval: false
    enforce_admins: true
    restrict_pushes: true
    require_signed_commits: false
    require_linear_history: true
    require_conversation_resolution: true
    block_force_pushes: true
    block_deletions: true
teams: {}
compliance:
  frameworks:
  - soc2
  - gdpr
  - iso27001
  - pci-dss
  data_classification: internal
  required_gates:
    dependency_scan: true
    secret_scan: true
    license_check: true
    code_quality: true
    security_review: true
