name: jolarca-security
description: "Security policies, threat models, and security architecture for the jolarca-dev marketplace"
visibility: public
tier: governance
criticality: tier-2
launch_status: planned
language: Markdown
topics:
- marketplace
- security
- threat-model
- iso27001
- soc2
- pci-dss
settings:
  has_issues: true
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
  web_commit_signoff_required: true
branch_protection:
  main:
    pattern: main
    required_status_checks:
      strict: true
      # GitHub names a required status check after a job's `name:` when it has one and falls back to
      # the job key otherwise. Trunk declared [lint, security], which matches no job this repo can
      # report, so applying it under strict:true would have blocked every PR (drift register D-47,
      # recorded in jolarca-control#31).
      #
      # MERGE AFTER jolarca-security#3, which itself merges after #2. Two distinct bricks, measured
      # 2026-10-04: before #2 the gitleaks workflow fails to LOAD (abbreviated action ref), so it
      # emits no check at all and `secret-scan` can never report; before #3 the four jobs still carry
      # prose `name:` overrides, so the contexts GitHub reports are sentences, not these keys.
      #
      # Intent preserved, plus one honest addition. [lint, security] evidently meant "the linters" and
      # "the secret scan"; naming them individually yields markdown-lint, secret-scan and yaml-lint.
      # The fourth, policy-tests, is the policy-as-code suite jolarca-security#2 introduces: this file
      # now requires four checks because the repo will run four. Strict mode, enforce_admins and the
      # review block are untouched. Requiring secret-scan also makes compliance.required_gates
      # .secret_scan on the bottom of this file true in fact and not merely declared (cf. D-40).
      contexts:
      - markdown-lint
      - policy-tests
      - secret-scan
      - yaml-lint
    required_pull_request_reviews:
      required_approving_review_count: 0
      dismiss_stale_reviews: true
      require_code_owner_reviews: false
      require_last_push_approval: false
    enforce_admins: true
    restrict_pushes: true
    require_signed_commits: false
    require_linear_history: true
    require_conversation_resolution: true
    block_force_pushes: true
    block_deletions: true
teams: {}
compliance:
  frameworks:
  - soc2
  - gdpr
  - iso27001
  - pci-dss
  data_classification: internal
  required_gates:
    secret_scan: true
    security_review: true
