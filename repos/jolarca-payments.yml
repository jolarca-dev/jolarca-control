name: jolarca-payments
description: "Payment processing, billing, and PCI-DSS compliance for the jolarca-dev marketplace"
# PCI-DSS public visibility risk acceptance (2026-09-30):
# This repo is PCI-DSS-scoped but launch_status is `planned`, not `operational`.
# data_classification is `internal` — no regulated data lives in the repo itself;
# payment secrets and cardholder data live in runtime, not in git. The guard in
# validate_repos.py fires only when launch_status becomes `operational`; this
# field pre-positions the override so the transition is not silently blocked.
# Full risk acceptance: policy/compliance-gates.yml exceptions.active.
documented_risk_acceptance: true
visibility: public
tier: platform
criticality: tier-1
launch_status: planned
language: Python
topics:
- marketplace
- payments
- billing
- pci-dss
- payment-processing
settings:
  has_issues: true
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
  web_commit_signoff_required: true
branch_protection:
  main:
    pattern: main
    required_status_checks:
      strict: true
      contexts:
      - ci
      - security
    required_pull_request_reviews:
      required_approving_review_count: 0
      dismiss_stale_reviews: true
      require_code_owner_reviews: false
      require_last_push_approval: false
    enforce_admins: true
    restrict_pushes: true
    require_signed_commits: false
    require_linear_history: true
    require_conversation_resolution: true
    block_force_pushes: true
    block_deletions: true
teams: {}
compliance:
  frameworks:
  - pci-dss
  - soc2
  - iso27001
  - gdpr
  data_classification: internal
  required_gates:
    dependency_scan: true
    secret_scan: true
    code_quality: true
    security_review: true
