# Allow-list definition for jolarca-infrastructure
# Managed by jolarca-control — DO NOT edit outside this repo.
# Compliance: SOC2 / GDPR / ISO 27001 / PCI-DSS 4.0
#
# Settings verified against the live GitHub API on 2026-09-25 EXCEPT
# visibility — BLOCKING DECISION D-01, see docs/drift-findings.md.

name: jolarca-infrastructure
description: "Marketplace infrastructure-as-code and provisioning (scope-segregated from church-platform infra)."

# Declared private per the intent of record (github-org module: "The
# infrastructure ... repos in this fleet are private"). Live reality is PUBLIC,
# which exposes network topology, hostnames, WireGuard/VLAN layout and Vault
# configuration for a PCI-DSS scope. apply.yml refuses visibility changes.
# PCI-DSS public visibility risk acceptance (2026-09-30):
# GitHub is migrating all repos to public within 10 days. This repo is
# PCI-DSS-scoped and operational. Risk acceptance recorded per D-25 pattern.
documented_risk_acceptance: true
visibility: public

tier: devops
# tier-1: holds the network topology, hostnames and WireGuard layout — i.e. the
# CDE perimeter and the controls that protect regulated data.
# operational: live Terraform state manages real infrastructure from here today
# (state serial 25; see docs/drift-findings.md D-02 / D-13).
criticality: tier-1
launch_status: operational
language: HCL
topics:
- ansible
- bare-metal
- gcp
- gdpr
- gke
- infrastructure-as-code
- iso27001
- kubernetes
- marketplace
- opa
- pci-dss
- soc2
- terraform
- vault
- wireguard
settings:
  has_issues: false
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
  web_commit_signoff_required: true
branch_protection:
  main:
    pattern: main
    required_status_checks:
      strict: true
      contexts:
      - ci
      - security
      - compliance
    required_pull_request_reviews:
      # SOLO-ERA DEVIATION — D-04
      required_approving_review_count: 0
      dismiss_stale_reviews: true
      # require_code_owner_reviews=false: INERT without jolarca-dev teams
      # (D-10/D-20); matches policy/repo-defaults baseline. Raise to true in the
      # same PR that creates teams and CODEOWNERS owners (this repo also has no
      # CODEOWNERS file yet — see docs/drift-findings.md D-20 correction 2026-10-06).
      require_code_owner_reviews: false
      require_last_push_approval: false
    enforce_admins: true
    restrict_pushes: true
    # Deviation D-05
    require_signed_commits: false
    require_linear_history: true
    require_conversation_resolution: true
    block_force_pushes: true
    block_deletions: true
# jolarca-dev has NO teams (verified 2026-09-25). See D-10.
teams: {}
compliance:
  frameworks:
  - soc2
  - gdpr
  - iso27001
  - pci-dss
  data_classification: internal
  required_gates:
    dependency_scan: true
    secret_scan: true
    license_check: true
    code_quality: true
    iac_scan: true
    iac_policy: true
    security_review: true
