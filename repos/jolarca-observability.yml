# Allow-list definition for jolarca-observability
# Managed by jolarca-control — DO NOT edit outside this repo.
# Compliance: SOC2 / GDPR / ISO 27001 / PCI-DSS 4.0
#
# PCI-DSS Req. 10 audit-log configurations, alerting rules, and integrity
# mechanisms for the marketplace payment/KYC-AML scope.

name: jolarca-observability
description: "Centralized logging, alerting, audit-trail retention and log-integrity (PCI-DSS Req. 10) for the jolarca-dev marketplace"

# Classification: confidential — logging configs reveal what is monitored,
# detection thresholds, and retention windows. An attacker reading these
# learns how to evade audit detection. Same rationale as jolarca-security.
visibility: public

tier: governance
# tier-2: holds audit-trail configurations and integrity mechanisms for a
# PCI-DSS/KYC-AML scope. Compromise degrades the ability to detect and
# investigate security incidents, but does not by itself expose regulated
# data at rest.
criticality: tier-2
launch_status: in-development
language: Python
topics:
- audit-trail
- alerting
- gdpr
- hash-chain
- iso27001
- logging
- marketplace
- monitoring
- observability
- opentelemetry
- pci-dss
- soc2
settings:
  has_issues: true
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
  web_commit_signoff_required: true
branch_protection:
  main:
    pattern: main
    required_status_checks:
      strict: true
      contexts:
      - ci
      - security
      - compliance
    required_pull_request_reviews:
      # SOLO-ERA DEVIATION — docs/drift-findings.md D-04
      required_approving_review_count: 0
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
      require_last_push_approval: false
    enforce_admins: true
    restrict_pushes: true
    # Deviation D-05
    require_signed_commits: false
    require_linear_history: true
    require_conversation_resolution: true
    block_force_pushes: true
    block_deletions: true
# jolarca-dev has NO teams (verified 2026-09-25). See D-10.
teams: {}
compliance:
  frameworks:
  - soc2
  - gdpr
  - iso27001
  - pci-dss
  data_classification: internal
  required_gates:
    dependency_scan: true
    secret_scan: true
    code_quality: true
    security_review: true
