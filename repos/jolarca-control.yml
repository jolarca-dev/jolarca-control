# Allow-list definition for jolarca-control
# Managed by jolarca-control — DO NOT edit outside this repo.
# Compliance: SOC2 / GDPR / ISO 27001 / PCI-DSS 4.0
#
# License: proprietary — no LICENSE file is shipped. This is deliberate:
# jolarca-control is the org control plane, not a distributable artifact.
# The AGPL-3.0 license on jolarca (repos/jolarca.yml) covers the application
# code; this repo governs it.

name: jolarca-control
description: "GitHub org as code — fleet control plane for the jolarca-dev organization. Terraform IaC, repo allow-list, policy baselines, compliance gates, and audit checklists."

# PCI-DSS public visibility risk acceptance (ADR-0007):
# jolarca-control is the governance control plane for the fleet. It is
# deliberately public (docs/adr/0007-public-marketplace-repository.md) so the
# IaC, policy baselines and audit trail are externally verifiable. No regulated
# data lives in this repo (data_classification: internal); it holds Terraform
# definitions, YAML declarations and markdown documentation.
# Full risk acceptance: policy/compliance-gates.yml exceptions.active.
documented_risk_acceptance: true
visibility: public
tier: governance
# tier-1 per policy/repo-defaults.yml#asset_inventory: whoever controls this
# repo controls branch protection and visibility on every PCI-scoped repo in the
# org. operational: the repository exists and is actively managing the fleet.
criticality: tier-1
launch_status: operational
language: HCL
topics:
- compliance
- gdpr
- governance
- iac
- iso27001
- marketplace
- pci-dss
- soc2
- terraform
settings:
  # Issues ON for this repo (unlike the rest of the fleet): it is where
  # governance decisions, drift findings and migration tasks get tracked.
  has_issues: true
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
  web_commit_signoff_required: true
  license: proprietary
branch_protection:
  main:
    pattern: main
    required_status_checks:
      strict: true
      # ONLY contexts from compliance-scan.yml, which runs on every PR with no
      # path filter. plan.yml and fleet-separation-guard.yml are path-filtered,
      # so requiring their contexts would block docs-only PRs forever — the
      # exact failure mode the two-phase bootstrap doctrine warns about.
      contexts:
      - Validate Repo Allow-List
      - Policy Compliance Check
      - Repository Secret Pattern Scan
    required_pull_request_reviews:
      # SOLO-ERA DEVIATION — D-04
      required_approving_review_count: 0
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
      require_last_push_approval: false
    enforce_admins: true
    restrict_pushes: true
    # Deviation D-05
    require_signed_commits: false
    require_linear_history: true
    require_conversation_resolution: true
    block_force_pushes: true
    block_deletions: true
# jolarca-dev has NO teams (verified 2026-09-25). See D-10.
teams: {}
compliance:
  frameworks:
  - soc2
  - gdpr
  - iso27001
  - pci-dss
  data_classification: internal
  required_gates:
    dependency_scan: true
    secret_scan: true
    license_check: true
    code_quality: true
    iac_scan: true
    iac_policy: true
    security_review: true
