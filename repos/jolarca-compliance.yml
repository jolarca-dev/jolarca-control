# Allow-list definition for jolarca-compliance
# Managed by jolarca-control — DO NOT edit outside this repo.
# Compliance: SOC2 / GDPR / ISO 27001 / PCI-DSS 4.0
#
# All settings verified against the live GitHub API on 2026-09-25 EXCEPT
# visibility — see the BLOCKING note below.

name: jolarca-compliance
description: "Marketplace compliance evidence and audit records (ISO 27001 / SOC 2 / PCI-DSS)."

# ── BLOCKING DECISION D-01 (docs/drift-findings.md) ──────────────────────────
# Declared private: that is the intent of record inherited from
# jolarca-infrastructure/terraform/modules/github-org/variables.tf, whose own
# comment states "The infrastructure, compliance, legal, and data repos in this
# fleet are private." Live reality on 2026-09-25 is PUBLIC — unremediated drift
# observed as far back as the 2026-09-17 delivery-chain audit. This repo holds
# DPIAs, ERoPA entries and audit evidence inside a PCI-DSS/KYC-AML scope; it
# must not stay public. The apply workflow HARD-REFUSES any plan that changes
# visibility, so this cannot land silently — flip it consciously.
# PCI-DSS public visibility risk acceptance (2026-09-30):
# GitHub is migrating all repos to public within 10 days. This repo is
# PCI-DSS-scoped and operational. Risk acceptance recorded per D-25 pattern.
documented_risk_acceptance: true
visibility: public

tier: governance
# tier-2: holds the authoritative RoPA (GDPR Art. 30) and vendor assessments, so
# loss degrades the compliance position — but it records data CATEGORIES, not
# customer PII at rest, which is what separates tier-2 from tier-1 in the rubric.
# operational: these are live legal obligations, not drafts.
criticality: tier-2
launch_status: operational
language: Markdown
topics:
- audit
- compliance
- data-protection
- dpa
- evidence
- gdpr
- iso27001
- marketplace
- pci-dss
- retention
- rop
- soc2
settings:
  has_issues: false
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
  web_commit_signoff_required: true
branch_protection:
  main:
    pattern: main
    required_status_checks:
      strict: true
      contexts:
      - lint
      - governance
      - security
      - retention-tests
      # Gap 2.1 (pre-deployment review 2026-09-28): retention-tests was the
      # fourth CI job not declared in required-contexts. An undeclared check
      # is a check nobody is accountable for (SOC 2 CC8.1).
    required_pull_request_reviews:
      # SOLO-ERA DEVIATION — docs/drift-findings.md D-04
      required_approving_review_count: 0
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
      require_last_push_approval: false
    enforce_admins: true
    restrict_pushes: true
    # Deviation D-05
    require_signed_commits: false
    require_linear_history: true
    require_conversation_resolution: true
    block_force_pushes: true
    block_deletions: true
# jolarca-dev has NO teams (verified 2026-09-25). See D-10.
teams: {}
compliance:
  frameworks:
  - soc2
  - gdpr
  - iso27001
  - pci-dss
  data_classification: internal
  required_gates:
    dependency_scan: true
    secret_scan: true
    license_check: true
    code_quality: true
    security_review: true
